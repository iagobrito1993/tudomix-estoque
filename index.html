<style>

.up{border:2px dashed #c9c9c4;border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-align:center;background:#fafaf8}
.up:hover{border-color:var(--pri);background:#fff}.up .ic{font-size:26px}

.ia-lendo{background:#111;color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px;animation:pisca 1.4s infinite}@keyframes pisca{50%{opacity:.75}}

.ccs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ccs button{border-radius:99px;padding:4px 10px;font-size:12px}.ccs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
</style>

<body>
<div id="app"><div class="login"><img class="logo-img" src="logo.png" alt="Tudo Mix"><h1>Tudo Mix Estoque</h1><div class="sub">Carregando…</div></div></div>
<div id="ov" class="ov hidden"><div id="modal" class="modal"></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL='https://rxqlkfzsvoqydqqzffih.supabase.co';
const SUPABASE_KEY='sb_publishable__IZIszN0QheZChaDwqVA8A_vlQnP9tw';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const PAPEIS={admin:'Administrador',estoque:'Estoque',socio:'Sócio (só visualização)',cliente:'Cliente (vê só os envios dele)'};
const MODS={flex:'Flex',full:'Full',agencia:'Agência'};
let sessao=null,perfil=null,aba=null,busca='',filtroEst='com',filtroSai={conta:'',mod:'',status:'ativa'},D={produtos:[],contas:[],entradas:[],saidas:[],perfis:[],ajustes:[],notas:[],cp:[],pf:[]},modoLogin='entrar',carregando=false,limite=150;

// ---------- utilidades ----------
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hoje(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fd(s){if(!s)return '—';const p=String(s).slice(0,10).split('-');return `${p[2]}/${p[1]}/${p[0]}`;}
function fts(s){return s?new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';}
function brl(n,dec=2){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:dec});}
function un(n){return Number(n||0).toLocaleString('pt-BR');}
function num(v){const n=parseInt(String(v??'').replace(/\D/g,''),10);return isNaN(n)?0:n;}
function dinheiro(v){let s=String(v??'').trim().replace(/[R$\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s);}
function um(x){return Array.isArray(x)?x[0]||null:x||null;}
function val(id){const e=$(id);return e?e.value.trim():'';}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),3000);}
function ehAdmin(){return perfil&&perfil.papel==='admin';}
function verCusto(){return perfil&&['admin','socio'].includes(perfil.papel);}
function podeMov(){return perfil&&['admin','estoque'].includes(perfil.papel);}
function foto(p,peq){return `<div class="foto${peq?' p':''}">${p&&p.foto_url?`<img src="${esc(p.foto_url)}" alt="" loading="lazy">`:'📷'}</div>`;}
function produto(id){return D.produtos.find(p=>p.id===id)||{nome:'(produto)',sku:'',estoque:0};}
function conta(id){return D.contas.find(c=>c.id===id)||{nome:'—'};}
function custo(p){const c=um(p.produtos_custo);return c?+c.custo_medio:0;}
function nomeDe(uid){const p=D.perfis.find(x=>x.user_id===uid);return p?(p.nome||p.email):'';}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function msgErro(e){const m=(e&&(e.message||e.error_description))||'Erro inesperado.';
  if(/Invalid login/i.test(m))return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m))return 'Confirme seu e-mail antes de entrar (veja sua caixa de entrada).';
  if(/already registered/i.test(m))return 'Este e-mail já tem conta. Use "Entrar".';
  if(/Password should be/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(/row-level security|Unauthorized|not allowed/i.test(m))return 'Seu acesso não permite esta ação.';
  if(/Failed to fetch|NetworkError/i.test(m))return 'Sem conexão com a internet. Tente de novo.';
  return m;}
const NOMES_ACAO={registrar_entrada:'Registrou entrada',registrar_saida:'Registrou saída',cancelar_saida:'Cancelou saída',ajustar_estoque:'Ajustou estoque',definir_custo:'Alterou custo médio',salvar_produto:'Editou produto',definir_foto:'Alterou foto de produto',salvar_conta:'Alterou conta',definir_papel:'Alterou acesso de usuário',registrar_nota:'Lançou nota fiscal',salvar_conta_pagar:'Salvou conta a pagar',pagar_conta:'Registrou pagamento',excluir_conta_pagar:'Excluiu conta a pagar',anexar_boleto:'Anexou boleto',definir_contas_cliente:'Alterou contas do cliente'};
function log(ev,d){try{sb.rpc('registrar_acesso',{p_evento:ev,p_detalhe:d==null?null:String(d).slice(0,300)}).then(()=>{},()=>{});}catch(e){}}
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error)throw error;log('acao',NOMES_ACAO[fn]||fn);return data;}
async function tudo(q){const out=[];for(let i=0;;i+=1000){const {data,error}=await q().range(i,i+999);if(error)throw error;out.push(...data);if(data.length<1000)break;}return out;}

// fotos
async function reduzirImagem(file,max=1200){
  if(!/^image\//.test(file.type))throw new Error('Escolha um arquivo de imagem (foto).');
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>er(new Error('Não foi possível abrir esta imagem.'));i.src=url;});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.82));}
  finally{URL.revokeObjectURL(url);}
}
async function enviarFoto(pid,file){
  const blob=await reduzirImagem(file);const caminho='p'+pid+'/'+Date.now()+'.jpg';
  const {error}=await sb.storage.from('produtos').upload(caminho,blob,{contentType:'image/jpeg',upsert:true,cacheControl:'31536000'});
  if(error)throw error;
  const url=sb.storage.from('produtos').getPublicUrl(caminho).data.publicUrl;
  await rpc('definir_foto',{p_produto:pid,p_url:url});
  const p=D.produtos.find(p=>p.id===pid);if(p)p.foto_url=url;return url;
}
function ampliar(u){const d=document.createElement('div');d.className='lb';d.innerHTML=`<img src="${esc(u)}" alt="">`;d.onclick=()=>d.remove();document.body.appendChild(d);}

// ---------- modal ----------
function abrir(html,largo){$('modal').className='modal'+(largo?' largo':'');$('modal').innerHTML=html;$('ov').classList.remove('hidden');const f=$('modal').querySelector('input:not([type=hidden]):not([type=file]),select,textarea');if(f&&window.innerWidth>700)setTimeout(()=>f.focus(),30);}
function fechar(){$('ov').classList.add('hidden');$('modal').innerHTML='';}
$('ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')fechar();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('ov').classList.contains('hidden'))fechar();});
async function rodar(btn,fn){const err=$('modal').querySelector('.erro');if(err)err.textContent='';btn.disabled=true;
  try{await fn();}catch(e){console.error(e);if(err)err.textContent=msgErro(e);else toast(msgErro(e));btn.disabled=false;}}
function confirmar(t,txt,btn,fn){
  abrir(`<h2>${esc(t)}</h2><div class="sub">${esc(txt)}</div><div class="erro"></div><div class="rodape"><button id="cx">Voltar</button><button class="primary" id="ok">${esc(btn)}</button></div>`);
  $('cx').onclick=fechar;$('ok').onclick=()=>rodar($('ok'),async()=>{await fn();fechar();});
}

// ---------- autenticação ----------
const LOGO=`<img class="logo-img" src="logo.png" alt="Tudo Mix">`;
function telaLogin(msg){
  const cad=modoLogin==='criar',rec=modoLogin==='esqueci';
  $('app').innerHTML=`<div class="login">${LOGO}<h1>Tudo Mix Estoque</h1>
  <div class="sub">${cad?'Crie sua conta de acesso.':rec?'Vamos enviar um link para criar uma nova senha.':'Entre com seu e-mail e senha.'}</div>
  <form id="fl">
    ${cad?'<div class="campo"><label>Seu nome</label><input id="l_nome" autocomplete="name" required></div>':''}
    <div class="campo"><label>E-mail</label><input id="l_email" type="email" autocomplete="email" required></div>
    ${rec?'':`<div class="campo"><label>Senha</label><input id="l_senha" type="password" autocomplete="${cad?'new-password':'current-password'}" required minlength="6"></div>`}
    <div class="erro" id="l_erro">${esc(msg||'')}</div>
    <button class="primary" id="l_ok">${cad?'Criar conta':rec?'Enviar link':'Entrar'}</button>
  </form>
  <div class="alt">${cad||rec?'<button class="link" data-m="entrar">Voltar para entrar</button>':'<button class="link" data-m="criar">Criar conta</button> · <button class="link" data-m="esqueci">Esqueci a senha</button>'}</div></div>`;
  $('app').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{modoLogin=b.dataset.m;telaLogin();});
  $('fl').onsubmit=async e=>{e.preventDefault();const b=$('l_ok');b.disabled=true;$('l_erro').textContent='';
    const email=val('l_email');
    try{
      if(cad){const {data,error}=await sb.auth.signUp({email,password:$('l_senha').value,options:{data:{nome:val('l_nome')},emailRedirectTo:location.origin+location.pathname}});
        if(error)throw error;
        if(!data.session){modoLogin='entrar';telaLogin();$('l_erro').style.color='#15803d';$('l_erro').textContent='Conta criada! Abra o e-mail de confirmação que enviamos, clique no link e depois entre aqui.';return;}}
      else if(rec){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;
        $('l_erro').style.color='#15803d';$('l_erro').textContent='Pronto! Veja seu e-mail e clique no link.';b.disabled=false;return;}
      else{const {error}=await sb.auth.signInWithPassword({email,password:$('l_senha').value});if(error)throw error;}
    }catch(err){$('l_erro').style.color='';$('l_erro').textContent=msgErro(err);b.disabled=false;}
  };
}
function telaPendente(){
  $('app').innerHTML=`<div class="login">${LOGO}<h1>Tudo Mix Estoque</h1><div class="sub">Olá, ${esc(perfil?.nome||sessao.user.email)}.</div>
  <p class="passo">Sua conta foi criada e está aguardando liberação do administrador.</p>
  <button class="primary" id="pv" style="width:100%">Verificar de novo</button>
  <div class="alt"><button class="link" id="ps">Sair</button></div></div>`;
  $('pv').onclick=()=>carregarPerfil();$('ps').onclick=()=>sb.auth.signOut();
}
function modalNovaSenha(){
  abrir(`<h2>Criar nova senha</h2><div class="campo"><label>Nova senha</label><input id="ns" type="password" minlength="6" autocomplete="new-password"></div>
  <div class="erro"></div><div class="rodape"><button class="primary" id="ok">Salvar senha</button></div>`);
  $('ok').onclick=()=>rodar($('ok'),async()=>{const {error}=await sb.auth.updateUser({password:$('ns').value});if(error)throw error;fechar();toast('Senha alterada.');});
}
sb.auth.onAuthStateChange((ev,s)=>{
  if(ev==='PASSWORD_RECOVERY'){sessao=s;setTimeout(modalNovaSenha,300);}
  if(ev==='SIGNED_IN'&&(!sessao||sessao.user.id!==s.user.id)){sessao=s;setTimeout(carregarPerfil,0);}
  if(ev==='SIGNED_OUT'){sessao=null;perfil=null;aba=null;modoLogin='entrar';setTimeout(()=>telaLogin(),0);}
  if(s)sessao=s;
});
async function iniciar(){const {data:{session}}=await sb.auth.getSession();sessao=session;if(!sessao)return telaLogin();await carregarPerfil();}
async function carregarPerfil(){
  const {data,error}=await sb.from('perfis').select('*').eq('user_id',sessao.user.id).maybeSingle();
  if(error){$('app').innerHTML=`<div class="login">${LOGO}<h1>Tudo Mix Estoque</h1><p class="erro">Não foi possível carregar seu acesso. Recarregue a página.</p></div>`;return;}
  perfil=data;if(!perfil||!perfil.papel)return telaPendente();
  if(perfil.papel==='cliente'){if(!window._logou){window._logou=1;log('entrou','Entrou no sistema (cliente)');}return carregarCliente();}
  if(!aba)aba='estoque';
  if(!window._logou){window._logou=1;log('entrou','Entrou no sistema');}
  await carregar();
}

// ---------- dados ----------
async function carregar(){
  if(perfil&&perfil.papel==='cliente')return carregarCliente();
  if(carregando)return;carregando=true;
  try{
    const vc=verCusto();
    const [prods,contas,ents,sais,perfis,ajs,nts,cps,pfs]=await Promise.all([
      tudo(()=>sb.from('produtos').select('id,nome,sku,ean,marca,foto_url,estoque,ativo'+(vc?',produtos_custo(custo_medio)':'')).order('nome')),
      sb.from('contas').select('*').order('nome').then(r=>{if(r.error)throw r.error;return r.data;}),
      tudo(()=>sb.from('entradas').select('*'+(vc?',entradas_custo(custo_unit,custo_medio_antes,custo_medio_depois)':'')).neq('origem','olist').order('id',{ascending:false})),
      tudo(()=>sb.from('saidas').select('*,saida_itens(id,produto_id,qtd'+(vc?',saida_itens_custo(custo_medio)':'')+'),saida_anexos(id,nome,caminho,tamanho)').order('id',{ascending:false})),
      sb.from('perfis').select('*').order('nome').then(r=>{if(r.error)throw r.error;return r.data;}),
      sb.from('ajustes').select('*').order('id',{ascending:false}).limit(500).then(r=>r.data||[]),
      tudo(()=>sb.from('notas').select('*,nota_itens(*),nota_anexos(*)'+(vc?',notas_valor(*)':'')).order('id',{ascending:false})).catch(e=>{console.error(e);return [];}),
      vc?tudo(()=>sb.from('contas_pagar').select('*').order('vencimento')).catch(e=>{console.error(e);return [];}):Promise.resolve([]),
      tudo(()=>sb.from('produto_fornecedor').select('*')).catch(()=>[])]);
    D.produtos=prods;D.contas=contas;D.entradas=ents;D.saidas=sais;D.perfis=perfis;D.ajustes=ajs;D.notas=nts;D.cp=cps;D.pf=pfs;
    if(ehAdmin()){const x=await sb.from('acessos').select('*').order('id',{ascending:false}).limit(800);D.acessos=x.data||[];}
  }catch(e){console.error(e);toast('Não foi possível atualizar os dados.');}
  carregando=false;render();
}
setInterval(()=>{if(perfil&&perfil.papel&&$('ov').classList.contains('hidden')&&document.visibilityState==='visible')carregar();},90000);
setInterval(()=>{if(perfil&&document.visibilityState==='visible')sb.rpc('pulso').then(()=>{},()=>{});},50000);

// ---------- tela principal ----------
function abasDoPapel(){
  const a=[['estoque','Estoque'],['notas','Notas'],['entradas','Entradas'],['saidas','Saídas']];if(verCusto())a.push(['pagar','Contas a pagar']);a.push(['relatorio','Resumo por conta']);
  if(ehAdmin()){a.push(['contas','Contas']);a.push(['usuarios','Usuários']);a.push(['acessos','Acessos']);}
  return a;
}
function render(){
  if(!perfil||!perfil.papel)return;
  if(perfil.papel==='cliente')return renderCliente();
  const abas=abasDoPapel();if(!abas.find(x=>x[0]===aba))aba=abas[0][0];
  const conteudo={estoque:abaEstoque,notas:abaNotas,pagar:abaPagar,saidas:abaSaidas,entradas:abaEntradas,relatorio:abaRelatorio,contas:abaContas,usuarios:abaUsuarios,acessos:abaAcessos}[aba]();
  const ativo=document.activeElement&&document.activeElement.id==='busca';const pos=ativo?document.activeElement.selectionStart:0;
  $('app').innerHTML=`<div class="topo"><div class="wrap"><div class="marca">${LOGO}<div>Estoque<small>Notas · Entradas · Saídas · Contas a pagar</small></div></div>
    <div class="quem"><span>${esc(perfil.nome||perfil.email)}</span><span class="badge b-pap">${PAPEIS[perfil.papel]}</span>
    <button class="small" data-act="atualizar">Atualizar</button><button class="small" data-act="sair">Sair</button></div></div></div>
    <div class="wrap"><nav class="abas">${abas.map(([k,l])=>`<button class="${aba===k?'on':''}" data-aba="${k}">${l}</button>`).join('')}</nav>${conteudo}</div>`;
  if(ativo){const b=$('busca');if(b){b.focus();b.setSelectionRange(pos,pos);}}
}
function barraBusca(ph,botoes=''){return `<div class="barra"><input id="busca" type="search" placeholder="${ph}" value="${esc(busca)}">${botoes}</div>`;}
function bate(...c){const q=norm(busca.trim());return !q||q.split(/\s+/).every(w=>norm(c.join(' ')).includes(w));}
function botoesMov(){return podeMov()?'<button data-act="entrada">+ Entrada</button><button class="primary" data-act="saida">+ Saída</button>':'';}

function abaEstoque(){
  const vc=verCusto();
  const todos=D.produtos.filter(p=>p.ativo!==false);
  const f={com:p=>p.estoque>0,zer:p=>p.estoque<=0,todos:()=>true,semcusto:p=>p.estoque>0&&!custo(p)}[filtroEst]||(()=>true);
  const lst=todos.filter(f).filter(p=>bate(p.nome,p.sku,p.ean,p.marca)).sort((a,b)=>(b.estoque>0)-(a.estoque>0)||a.nome.localeCompare(b.nome));
  const com=todos.filter(p=>p.estoque>0);
  const tu=com.reduce((s,p)=>s+p.estoque,0),tv=com.reduce((s,p)=>s+p.estoque*custo(p),0);
  const chips=[['com','Com estoque ('+com.length+')'],['zer','Zerados ('+(todos.length-com.length)+')'],['todos','Todos ('+todos.length+')']];
  if(vc)chips.push(['semcusto','Sem custo ('+com.filter(p=>!custo(p)).length+')']);
  return barraBusca('Buscar produto, SKU, EAN ou marca…',botoesMov()+'<button data-act="estcsv">Exportar</button>')+
  `<div class="resumo"><div class="kpi"><div class="n">${un(com.length)}</div><div class="l">Produtos com estoque</div></div>
   <div class="kpi"><div class="n">${un(tu)}</div><div class="l">Unidades em estoque</div></div>
   ${vc?`<div class="kpi"><div class="n">${brl(tv)}</div><div class="l">Valor a custo médio</div></div>`:''}</div>
  <div class="chips" style="margin-bottom:10px">${chips.map(([k,l])=>`<button class="${filtroEst===k?'on':''}" data-fe="${k}">${l}</button>`).join('')}</div>
  <div class="lista">${lst.length?lst.slice(0,limite).map(p=>`<div class="card click" data-prod="${p.id}" style="${p.estoque>0?'':'opacity:.6'}"><div class="pinfo">${foto(p)}<div><div class="t">${esc(p.nome)}</div>
    <div class="meta">${[p.sku?'SKU '+esc(p.sku):'',p.ean?'EAN '+esc(p.ean):'',p.marca?esc(p.marca):''].filter(Boolean).join(' · ')}${vc?' · Custo médio <b>'+(custo(p)?brl(custo(p),2):'—')+'</b>':''}</div></div></div>
    <div class="dir"><div class="n">${un(p.estoque)} un.</div>${vc&&custo(p)?`<div class="meta">${brl(p.estoque*custo(p))}</div>`:''}</div></div>`).join('')
    +(lst.length>limite?`<button data-act="mais">Mostrar mais (${un(lst.length-limite)} restantes)</button>`:'')
    :`<div class="vazio">${D.produtos.length?'Nada encontrado.':'Nenhum produto ainda.'}</div>`}</div>`;
}

function itensSaida(s){return s.saida_itens||[];}
function totSaida(s){return itensSaida(s).reduce((a,i)=>a+i.qtd,0);}
function custoSaida(s){return itensSaida(s).reduce((a,i)=>{const c=um(i.saida_itens_custo);return a+i.qtd*(c?+c.custo_medio:0);},0);}
function badgeMod(m){return `<span class="badge m-${m}">${MODS[m]||m}</span>`;}
function selContas(id,v,todas){return `<select id="${id}">${todas?'<option value="">Todas as contas</option>':'<option value="">Escolha a conta…</option>'}${D.contas.filter(c=>todas||c.ativa).map(c=>`<option value="${c.id}" ${String(v)===String(c.id)?'selected':''}>${esc(c.nome)}</option>`).join('')}</select>`;}
function abaSaidas(){
  const f=filtroSai;
  const lst=D.saidas.filter(s=>(!f.conta||s.conta_id==f.conta)&&(!f.mod||s.modalidade===f.mod)&&(f.status==='todas'||s.status===f.status))
    .filter(s=>bate('#'+s.id,conta(s.conta_id).nome,MODS[s.modalidade],s.obs,...itensSaida(s).map(i=>{const p=produto(i.produto_id);return p.nome+' '+(p.sku||'')+' '+(p.ean||'');})));
  return barraBusca('Buscar saída, conta ou produto…',botoesMov())+
  `<div class="barra">${selContas('fs_conta',f.conta,true)}
   <select id="fs_mod"><option value="">Todas as modalidades</option>${Object.entries(MODS).map(([k,l])=>`<option value="${k}" ${f.mod===k?'selected':''}>${l}</option>`).join('')}</select>
   <select id="fs_st"><option value="ativa" ${f.status==='ativa'?'selected':''}>Ativas</option><option value="cancelada" ${f.status==='cancelada'?'selected':''}>Canceladas</option><option value="todas" ${f.status==='todas'?'selected':''}>Todas</option></select></div>
  <div class="lista">${lst.length?lst.slice(0,limite).map(s=>{const it=itensSaida(s);return `<div class="card click" data-sai="${s.id}" style="${s.status==='cancelada'?'opacity:.55':''}"><div><div class="t">Saída #${s.id} ${badgeMod(s.modalidade)} ${s.status==='cancelada'?'<span class="badge b-can">Cancelada</span>':''}</div>
    <div class="meta"><b>${esc(conta(s.conta_id).nome)}</b> · ${fd(s.data)} · ${it.length} produto(s)${(s.saida_anexos||[]).length?' · 🏷 etiqueta anexada':''}${nomeDe(s.criado_por)?' · por '+esc(nomeDe(s.criado_por)):''}</div>
    <div class="meta">${esc(it.slice(0,3).map(i=>produto(i.produto_id).nome+' ×'+i.qtd).join(' · '))}${it.length>3?' …':''}</div></div>
    <div class="dir"><div class="n">${un(totSaida(s))} un.</div>${verCusto()?`<div class="meta">${brl(custoSaida(s))}</div>`:''}</div></div>`;}).join('')
    +(lst.length>limite?`<button data-act="mais">Mostrar mais</button>`:'')
    :'<div class="vazio">Nenhuma saída registrada.</div>'}</div>`;
}

function abaEntradas(){

    <div class="meta">${fd(e.data)}${e.nf?' · NF '+esc(e.nf):''}${vc&&c&&c.custo_unit!=null?' · Custo unit. <b>'+brl(c.custo_unit,2)+'</b> · Custo médio '+brl(c.custo_medio_antes,2)+' → <b>'+brl(c.custo_medio_depois,2)+'</b>':''}</div>

let relDe='',relAte='';
function abaRelatorio(){
  if(!relDe){const d=new Date();relDe=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';relAte=hoje();}
  const vc=verCusto();
  const ss=D.saidas.filter(s=>s.status==='ativa'&&s.data>=relDe&&s.data<=relAte);
  const m={};
  ss.forEach(s=>{const k=s.conta_id;m[k]=m[k]||{flex:0,full:0,agencia:0,tot:0,val:0,n:0};m[k][s.modalidade]+=totSaida(s);m[k].tot+=totSaida(s);m[k].val+=custoSaida(s);m[k].n++;});
  const linhas=Object.entries(m).sort((a,b)=>b[1].tot-a[1].tot);
  const T=linhas.reduce((t,[,x])=>{['flex','full','agencia','tot','val','n'].forEach(k=>t[k]+=x[k]);return t;},{flex:0,full:0,agencia:0,tot:0,val:0,n:0});
  const pp={};ss.forEach(s=>itensSaida(s).forEach(i=>{pp[i.produto_id]=(pp[i.produto_id]||0)+i.qtd;}));
  const top=Object.entries(pp).sort((a,b)=>b[1]-a[1]).slice(0,15);
  return `<div class="barra" style="align-items:center"><label class="meta">De</label><input id="r_de" type="date" value="${relDe}" style="max-width:170px"><label class="meta">até</label><input id="r_ate" type="date" value="${relAte}" style="max-width:170px"></div>
  <div class="resumo"><div class="kpi"><div class="n">${un(T.n)}</div><div class="l">Saídas no período</div></div><div class="kpi"><div class="n">${un(T.tot)}</div><div class="l">Unidades que saíram</div></div>${vc?`<div class="kpi"><div class="n">${brl(T.val)}</div><div class="l">Valor a custo</div></div>`:''}</div>
  ${linhas.length?`<div class="scroll"><table class="planilha"><tr><th>Conta</th><th class="n">Flex</th><th class="n">Full</th><th class="n">Agência</th><th class="n">Total un.</th>${vc?'<th class="n">Valor a custo</th>':''}</tr>
  ${linhas.map(([k,x])=>`<tr><td>${esc(conta(+k).nome)}</td><td class="n">${un(x.flex)}</td><td class="n">${un(x.full)}</td><td class="n">${un(x.agencia)}</td><td class="n"><b>${un(x.tot)}</b></td>${vc?`<td class="n">${brl(x.val)}</td>`:''}</tr>`).join('')}
  <tr><td><b>Total</b></td><td class="n"><b>${un(T.flex)}</b></td><td class="n"><b>${un(T.full)}</b></td><td class="n"><b>${un(T.agencia)}</b></td><td class="n"><b>${un(T.tot)}</b></td>${vc?`<td class="n"><b>${brl(T.val)}</b></td>`:''}</tr></table></div>
  <h3>Produtos que mais saíram</h3><div class="scroll"><table class="planilha"><tr><th>Produto</th><th>SKU</th><th class="n">Unidades</th><th class="n">Em estoque</th></tr>${top.map(([pid,q])=>{const p=produto(+pid);return `<tr class="cl" data-prod="${pid}"><td>${esc(p.nome)}</td><td>${esc(p.sku||'')}</td><td class="n">${un(q)}</td><td class="n">${un(p.estoque)}</td></tr>`;}).join('')}</table></div>`
  :'<div class="vazio">Nenhuma saída neste período.</div>'}`;
}

function abaContas(){
  return `<div class="barra"><input id="c_nova" placeholder="Nome da nova conta (ex.: Mercado Livre Tudo Mix)"><button class="primary" data-act="novaconta">Adicionar conta</button></div>
  <div class="lista">${D.contas.length?D.contas.map(c=>`<div class="card"><div><div class="t">${esc(c.nome)}</div><div class="meta">${c.ativa?'Ativa':'Desativada'} · ${un(D.saidas.filter(s=>s.conta_id===c.id&&s.status==='ativa').length)} saída(s)</div></div>
    <div><button class="small" data-renconta="${c.id}">Renomear</button> <button class="small" data-togconta="${c.id}">${c.ativa?'Desativar':'Ativar'}</button></div></div>`).join(''):'<div class="vazio">Cadastre as contas (Mercado Livre, Amazon, Shopee…) para usar nas saídas.</div>'}</div>`;
}
function abaUsuarios(){
  return `<div class="total" style="margin-top:10px">Para dar acesso a alguém: peça para a pessoa abrir este site e tocar em <b>Criar conta</b>. Depois ela aparece aqui e você escolhe o acesso.</div>
  <div class="lista">${D.perfis.map(p=>`<div class="card"><div><div class="t">${esc(p.nome||'')}</div><div class="meta">${esc(p.email||'')}</div>${p.papel?'':'<div class="warn">Aguardando liberação</div>'}${p.papel==='cliente'?`<div class="meta" style="margin-top:6px">Contas que este cliente vê:</div><div class="ccs">${D.contas.map(c=>`<button class="${(p.contas||[]).includes(c.id)?'on':''}" data-cc="${p.user_id}|${c.id}">${esc(c.nome)}</button>`).join('')||'<span class="meta">Cadastre as contas primeiro.</span>'}</div>`:''}</div>
    <div><select data-papel="${p.user_id}" style="min-width:150px"><option value="">Sem acesso</option>${Object.entries(PAPEIS).map(([k,l])=>`<option value="${k}" ${p.papel===k?'selected':''}>${l}</option>`).join('')}</select></div></div>`).join('')}</div>
  <div class="meta" style="margin-top:10px"><b>Administrador:</b> vê e faz tudo, inclusive custo, ajustes e contas. <b>Estoque:</b> lança entradas e saídas e anexa fotos e etiquetas, sem ver custo. <b>Sócio:</b> vê tudo, inclusive custo e contas a pagar, e não altera nada. <b>Cliente:</b> vê só os envios (saídas) das contas marcadas para ele, sem custo e sem o resto do estoque.</div>`;
}
let filtroAc='';
function abaAcessos(){
  const agora=Date.now();const on=D.perfis.filter(p=>p.ultimo_acesso&&agora-new Date(p.ultimo_acesso).getTime()<180000);
  const txt=a=>a.evento==='aba'?'Abriu a aba <b>'+esc(a.detalhe)+'</b>':a.evento==='acao'?'<b>'+esc(a.detalhe)+'</b>':a.evento==='abriu'?'Abriu '+esc(a.detalhe):a.evento==='entrou'?'Entrou no sistema':esc(a.evento+' '+(a.detalhe||''));
  const lst=(D.acessos||[]).filter(a=>!filtroAc||a.user_id===filtroAc);
  return `<div class="total" style="margin-top:10px"><b>Online agora (${on.length}):</b> ${on.length?on.map(p=>'🟢 '+esc(p.nome||p.email)).join(' · '):'ninguém além de você'}</div>
  <div class="barra"><select id="filtroAc"><option value="">Todas as pessoas</option>${D.perfis.map(p=>`<option value="${p.user_id}" ${filtroAc===p.user_id?'selected':''}>${esc(p.nome||p.email)}</option>`).join('')}</select></div>

}

// ---------- busca de produto (nome, SKU, EAN ou leitor de código de barras) ----------
function acharCodigo(t){t=String(t||'').trim();if(!t)return null;const l=t.toLowerCase();
  return D.produtos.find(p=>(p.sku||'').toLowerCase()===l)||D.produtos.find(p=>(p.ean||'')===t)||null;}
function sugestoes(t,soComEstoque){const q=norm(t.trim());if(q.length<2)return [];const ws=q.split(/\s+/);
  return D.produtos.filter(p=>(!soComEstoque||p.estoque>0)&&ws.every(w=>norm(p.nome+' '+(p.sku||'')+' '+(p.ean||'')+' '+(p.marca||'')).includes(w))).slice(0,12);}
function ligarBusca(inp,box,soComEstoque,escolher){
  const mostrar=()=>{const l=sugestoes(inp.value,soComEstoque);box.innerHTML=l.map(p=>`<div class="sug" data-pid="${p.id}">${foto(p,1)}<div><div>${esc(p.nome)}</div><div class="meta">${esc(p.sku||'')}${p.ean?' · '+esc(p.ean):''} · ${un(p.estoque)} un.</div></div></div>`).join('');box.classList.toggle('hidden',!l.length);};
  inp.addEventListener('input',mostrar);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const p=acharCodigo(inp.value)||(sugestoes(inp.value,soComEstoque).length===1?sugestoes(inp.value,soComEstoque)[0]:null);if(p){box.classList.add('hidden');escolher(p);}}});
  box.addEventListener('mousedown',e=>{const s=e.target.closest('[data-pid]');if(!s)return;e.preventDefault();box.classList.add('hidden');escolher(produto(+s.dataset.pid));});
}

  <div class="campo"><label>Produto</label><input id="e_busca" placeholder="Nome, SKU ou EAN" autocomplete="off" value="${sel?esc(sel.nome):''}"><div id="e_sug" class="sugs hidden"></div></div>
  <div id="e_novo" class="${sel?'hidden':''}"><div class="meta" style="margin:-4px 0 8px">Produto novo? Preencha SKU e EAN abaixo. Se escolher um produto da lista, estes campos somem.</div>
   <div class="duas"><div class="campo"><label>SKU</label><input id="e_sku"></div><div class="campo"><label>EAN</label><input id="e_ean" inputmode="numeric"></div></div></div>

  <div class="campo"><label>Nota fiscal</label><input id="e_nf"></div></div>
  <div class="duas"><div class="campo"><label>Data</label><input id="e_data" type="date" value="${hoje()}"></div><div class="campo"><label>Observação</label><input id="e_obs"></div></div>
  <div class="total" id="e_prev"></div>
  <div class="erro"></div>
  <div class="rodape"><button id="cx">Cancelar</button><button id="mais">Salvar e lançar outro</button><button class="primary" id="ok">Salvar entrada</button></div>`);
  const prev=()=>{const q=num(val('e_qtd')),c=adm?dinheiro(val('e_custo')):NaN,el=$('e_prev');
    $('e_novo').classList.toggle('hidden',!!sel);$('e_sel').classList.toggle('hidden',!sel);
    if(sel)$('e_sel').innerHTML=`<b>${esc(sel.nome)}</b><br>${esc(sel.sku||'')} · Estoque atual: <b>${un(sel.estoque)} un.</b>${adm?' · Custo médio '+brl(custo(sel),2):''}`;
    if(!q){el.textContent='Informe a quantidade.';return;}
    const q0=sel?sel.estoque:0;let t=`Novo estoque: <b>${un(q0+q)} un.</b>`;
    if(adm&&!isNaN(c)){const c0=sel?custo(sel):0;const nv=q0>0&&c0>0?(q0*c0+q*c)/(q0+q):c;t+=` · Novo custo médio: <b>${brl(nv,2)}</b> · Valor da entrada ${brl(q*c)}`;}
    el.innerHTML=t;};
  ligarBusca($('e_busca'),$('e_sug'),false,p=>{sel=p;$('e_busca').value=p.nome;prev();$('e_qtd').focus();});
  $('e_busca').addEventListener('input',()=>{if(sel&&$('e_busca').value!==sel.nome){sel=null;prev();}});
  ['e_qtd','e_custo'].forEach(id=>$(id)&&$(id).addEventListener('input',prev));prev();
  $('cx').onclick=fechar;
  const salvar=(cont,btn)=>{const q=num(val('e_qtd')),c=adm?dinheiro(val('e_custo')):NaN,err=$('modal').querySelector('.erro');
    if(!sel&&!val('e_busca')){err.textContent='Informe o produto.';return;}
    if(!q){err.textContent='Informe a quantidade.';return;}
    if(!sel&&!val('e_sku')){err.textContent='Produto novo: informe o SKU (ou escolha um produto da lista).';return;}
    rodar(btn,async()=>{await rpc('registrar_entrada',{p_produto_id:sel?sel.id:null,p_nome:sel?null:val('e_busca'),p_sku:sel?null:val('e_sku'),p_ean:sel?null:val('e_ean'),p_qtd:q,p_custo:isNaN(c)?null:c,p_nf:val('e_nf'),p_data:val('e_data')||hoje(),p_obs:val('e_obs')});
      await carregar();toast('Entrada registrada.');if(cont)modalEntrada();else fechar();});};
  $('ok').onclick=()=>salvar(false,$('ok'));$('mais').onclick=()=>salvar(true,$('mais'));
}

let rascunho=null;

    abrir(`<h2>Nova saída</h2><div class="sub">Escolha a conta e a modalidade, depois adicione os produtos (nome, SKU, EAN ou leitor de código de barras).</div>
    <div class="duas"><div class="campo"><label>Conta</label>${selContas('s_conta',R.conta)}</div>

    <div class="campo"><label>Modalidade</label><div class="seg">${Object.entries(MODS).map(([k,l])=>`<button type="button" class="${R.mod===k?'on':''}" data-mod="${k}">${l}</button>`).join('')}</div></div>
    <div class="campo"><label>Adicionar produto</label><input id="s_busca" placeholder="Nome, SKU ou EAN" autocomplete="off"><div id="s_sug" class="sugs hidden"></div></div>
    ${R.itens.length?`<div class="tab">${R.itens.map((i,ix)=>{const p=produto(i.pid);return `<div class="lin"><div class="pinfo">${foto(p,1)}<div><div>${esc(p.nome)}</div><div class="meta">${esc(p.sku||'')} · disponível ${un(p.estoque)}</div>${i.qtd>p.estoque?'<div class="warn">Mais do que o estoque</div>':''}</div></div>
      <div style="display:flex;gap:6px;align-items:center"><input data-qi="${ix}" value="${i.qtd}" inputmode="numeric"><button class="small danger" data-rmi="${ix}">✕</button></div></div>`;}).join('')}</div>`:'<div class="vazio" style="padding:18px">Nenhum produto adicionado.</div>'}
    <div class="campo" style="margin-top:10px"><label>Observação</label><input id="s_obs" value="${esc(R.obs)}" placeholder="ex.: nº do envio Full, coleta…"></div>

    <div class="erro"></div>

    const guardar=()=>{R.conta=val('s_conta');R.data=val('s_data')||hoje();R.obs=val('s_obs');};
    ['s_conta','s_data','s_obs'].forEach(id=>$(id).addEventListener('change',guardar));$('s_obs').addEventListener('input',guardar);
    $('modal').querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{guardar();R.mod=b.dataset.mod;desenhar();});
    $('modal').querySelectorAll('[data-qi]').forEach(inp=>inp.addEventListener('change',()=>{guardar();const q=num(inp.value);if(q)R.itens[+inp.dataset.qi].qtd=q;desenhar();}));
    $('modal').querySelectorAll('[data-rmi]').forEach(b=>b.onclick=()=>{guardar();R.itens.splice(+b.dataset.rmi,1);desenhar();});
    ligarBusca($('s_busca'),$('s_sug'),true,p=>{guardar();const ex=R.itens.find(i=>i.pid===p.id);if(ex)ex.qtd++;else R.itens.push({pid:p.id,qtd:1});desenhar();setTimeout(()=>$('s_busca').focus(),40);});
    $('cx').onclick=()=>{guardar();fechar();};
    if($('limpar'))$('limpar').onclick=()=>{rascunho=null;modalSaida();};
    $('ok').onclick=()=>{guardar();const err=$('modal').querySelector('.erro');
      if(!R.conta){err.textContent='Escolha a conta.';return;}if(!R.mod){err.textContent='Escolha a modalidade: Flex, Full ou Agência.';return;}
      if(!R.itens.length){err.textContent='Adicione pelo menos um produto.';return;}
      const arqs=[...$('s_arq').files];
      rodar($('ok'),async()=>{const id=await rpc('registrar_saida',{p_conta_id:+R.conta,p_modalidade:R.mod,p_data:R.data,p_obs:R.obs,p_itens:R.itens.map(i=>({produto_id:i.pid,qtd:i.qtd}))});
        gravarPref('tm_conta',R.conta);gravarPref('tm_mod',R.mod);
        let falhou=0;for(const f of arqs){try{await enviarAnexo(id,f);}catch(e){falhou++;}}
        rascunho=null;await carregar();fechar();toast(falhou?'Saída registrada, mas '+falhou+' arquivo(s) não foram enviados.':'Saída #'+id+' registrada.');});};
  };
  desenhar();

async function enviarAnexo(sid,f){
  if(f.size>15e6)throw new Error('Arquivo maior que 15 MB.');
  const ext=(f.name.split('.').pop()||'pdf').toLowerCase().replace(/[^a-z0-9]/g,'');
  const caminho='s'+sid+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
  const {error}=await sb.storage.from('etiquetas').upload(caminho,f,{contentType:f.type||'application/pdf',upsert:false});if(error)throw error;
  const {error:e2}=await sb.from('saida_anexos').insert({saida_id:sid,nome:f.name.slice(0,150),caminho,tamanho:f.size});
  if(e2){sb.storage.from('etiquetas').remove([caminho]).then(()=>{},()=>{});throw e2;}
}

async function subirArq(bucket,pasta,f){
  if(f.size>20e6)throw new Error('Arquivo maior que 20 MB: '+f.name);
  const ext=((f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,''))||'bin';
  const caminho=pasta+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
  const {error}=await sb.storage.from(bucket).upload(caminho,f,{contentType:f.type||'application/octet-stream',upsert:false});
  if(error)throw error;return caminho;
}

function lerXmlNF(texto){

  const inf=tg(doc,'infNFe');if(!inf)throw new Error('Este XML não é de uma NF-e.');

    return {codigo:tx(p,'cProd'),descricao:tx(p,'xProd'),eanCom:tx(p,'cEAN'),eanTrib:tx(p,'cEANTrib'),unidade:tx(p,'uCom'),
      qtd_nf:nn(tx(p,'qCom')),qTrib:nn(tx(p,'qTrib')),vprod:nn(tx(p,'vProd')),vdesc:nn(tx(p,'vDesc')),vfrete:nn(tx(p,'vFrete')),voutro:nn(tx(p,'vOutro')),
      vipi:nn(tx(tg(imp,'IPI'),'vIPI')),vst:nn(tx(imp,'vICMSST'))+nn(tx(imp,'vFCPST'))};});

  return {chave,numero:tx(ide,'nNF'),serie:tx(ide,'serie'),emissao:(tx(ide,'dhEmi')||tx(ide,'dEmi')).slice(0,10),
    cnpj:tx(emit,'CNPJ')||tx(emit,'CPF'),fornecedor:tx(emit,'xFant')||tx(emit,'xNome'),
    valor_total:nn(tx(tot,'vNF')),valor_produtos:nn(tx(tot,'vProd')),frete:nn(tx(tot,'vFrete')),ipi:nn(tx(tot,'vIPI')),st:nn(tx(tot,'vST')),desconto:nn(tx(tot,'vDesc')),itens,parcelas};
}

  return {chave:c,cnpj:c.slice(6,20),serie:String(+c.slice(22,25)),numero:String(+c.slice(25,34))};}
const okEan=e=>/^\d{8,14}$/.test(e||'');
function casarItem(it,cnpj){

  if(m&&D.produtos.find(p=>p.id===m.produto_id))return {pid:m.produto_id,fator:+m.fator||1,como:'código do fornecedor'};
  let fator=1;
  if(okEan(it.eanTrib)&&it.eanTrib!==it.eanCom&&it.qTrib>it.qtd_nf&&it.qtd_nf>0){const f=it.qTrib/it.qtd_nf;if(Math.abs(f-Math.round(f))<1e-6)fator=Math.round(f);}
  if(okEan(it.eanCom)){const p=D.produtos.find(p=>p.ean===it.eanCom);if(p)return {pid:p.id,fator:1,como:'EAN'};}
  if(okEan(it.eanTrib)){const p=D.produtos.find(p=>p.ean===it.eanTrib);if(p)return {pid:p.id,fator,como:'EAN'};}

// ================= BOLETO (linha digitável) =================
function mod10(s){let soma=0,m=2;for(let i=s.length-1;i>=0;i--){let r=+s[i]*m;if(r>9)r=Math.floor(r/10)+r%10;soma+=r;m=m===2?1:2;}return (10-soma%10)%10;}
function dataFator(f){if(!f)return '';const um=864e5,t=Date.now();const d1=Date.UTC(1997,9,7)+f*um,d2=Date.UTC(2025,1,22)+(f-1000)*um;return new Date(Math.abs(d2-t)<Math.abs(d1-t)?d2:d1).toISOString().slice(0,10);}
function lerLinha(s){const d=String(s||'').replace(/\D/g,'');
  if(d.length===47){if(mod10(d.slice(0,9))!==+d[9]||mod10(d.slice(10,20))!==+d[20]||mod10(d.slice(21,31))!==+d[31])return null;return {linha:d,valor:+d.slice(37)/100,vencimento:dataFator(+d.slice(33,37))};}
  if(d.length===44&&d[0]!=='8')return {linha:d,valor:+d.slice(9,19)/100,vencimento:dataFator(+d.slice(5,9))};
  if(d.length===48&&d[0]==='8'){const b=d.slice(0,11)+d.slice(12,23)+d.slice(24,35)+d.slice(36,47);return {linha:d,valor:+b.slice(4,15)/100,vencimento:''};}
  return null;}
function acharLinha(t){const cs=String(t||'').match(/\d[\d.\s]{44,70}\d/g)||[];
  for(const c of cs){const d=c.replace(/\D/g,'');for(let i=0;i+47<=d.length;i++){const r=lerLinha(d.slice(i,i+47));if(r)return r;}
    for(let i=0;i+48<=d.length;i++){if(d[i]==='8'){const r=lerLinha(d.slice(i,i+48));if(r)return r;}}}
  return null;}
function fmtLinha(l){const d=String(l||'');if(d.length===47)return `${d.slice(0,5)}.${d.slice(5,10)} ${d.slice(10,15)}.${d.slice(15,21)} ${d.slice(21,26)}.${d.slice(26,32)} ${d[32]} ${d.slice(33)}`;return d.replace(/(\d{12})/g,'$1 ').trim();}
let _pdfjs=null;
async function textoPdf(f){
  if(!_pdfjs){_pdfjs=await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs');_pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';}
  const pdf=await _pdfjs.getDocument({data:await f.arrayBuffer()}).promise;let t='';
  for(let i=1;i<=Math.min(pdf.numPages,3);i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n';}
  return t;}
async function lerBoleto(f){
  try{if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)){const l=acharLinha(await textoPdf(f));if(l)return l;}}catch(e){console.warn(e);}

    return lerLinha(b.linha_digitavel)||{linha:String(b.linha_digitavel||'').replace(/\D/g,''),valor:+b.valor||0,vencimento:b.vencimento||'',duvida:true};}

// ================= IA: melhora a imagem e lê nota/boleto =================
async function melhorarImagem(file){
  if(!/^image\//.test(file.type||''))return file;
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=url;});
    const k=Math.min(1,2400/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    const d=x.getImageData(0,0,w,h),p=d.data,hist=new Uint32Array(256);
    for(let i=0;i<p.length;i+=4){const g=(p[i]*.299+p[i+1]*.587+p[i+2]*.114)|0;p[i]=g;hist[g]++;}
    const tot=w*h;let lo=0,hi=255,a=0;for(let v=0;v<256;v++){a+=hist[v];if(a>tot*.01){lo=v;break;}}a=0;for(let v=255;v>=0;v--){a+=hist[v];if(a>tot*.01){hi=v;break;}}
    const m=hi-lo>20?255/(hi-lo):1;
    for(let i=0;i<p.length;i+=4){let g=(p[i]-lo)*m;g=g<0?0:g>255?255:g;g=255*Math.pow(g/255,1.2);p[i]=p[i+1]=p[i+2]=g;}
    x.putImageData(d,0,0);
    const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.86));
    return new File([blob],(file.name||'foto').replace(/\.[^.]+$/,'')+'-melhorada.jpg',{type:'image/jpeg'});
  }catch(e){console.warn(e);return file;}finally{URL.revokeObjectURL(url);}
}
function b64(f){return new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=er;r.readAsDataURL(f);});}
async function pdfParaImagens(f){
  await textoPdf(f).catch(()=>'');const pdf=await _pdfjs.getDocument({data:await f.arrayBuffer()}).promise;const out=[];
  for(let i=1;i<=Math.min(pdf.numPages,6);i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:2});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const b=await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.9));out.push(new File([b],'pagina'+i+'.jpg',{type:'image/jpeg'}));}
  return out;}
async function prepararIA(files){
  const out=[];
  for(const f of files){
    if(/pdf/i.test(f.type)||/\.pdf$/i.test(f.name)){
      let t='';try{t=await textoPdf(f);}catch(e){}
      if(t.replace(/\s/g,'').length<80){for(const im of await pdfParaImagens(f))out.push({mime:'image/jpeg',base64:await b64(await melhorarImagem(im))});} // PDF escaneado: melhora cada página
      else out.push({mime:'application/pdf',base64:await b64(f)});
    }else{const g=/melhorada/.test(f.name)?f:await melhorarImagem(f);out.push({mime:'image/jpeg',base64:await b64(g)});}
  }
  return out;}

function aplicarBoletosIA(N,bols,arq){
  for(const b of (bols||[])){const l=lerLinha(b.linha_digitavel);const venc=(l&&l.vencimento)||b.vencimento||'';const valor=(l&&l.valor)||+b.valor||0;
    let p=N.parcelas.find(p=>!p.linha&&venc&&p.vencimento===venc)||N.parcelas.find(p=>!p.linha&&valor&&Math.abs((+p.valor||0)-valor)<0.01)||N.parcelas.find(p=>!p.linha&&!p.vencimento);
    if(!p){p={parcela:'',vencimento:venc,valor,arq:null};N.parcelas.push(p);}
    p.linha=l?l.linha:String(b.linha_digitavel||'').replace(/\D/g,'');if(!p.vencimento)p.vencimento=venc;if(!p.valor)p.valor=valor;if(arq&&!p.arq)p.arq=arq;
    if(!l)N.avisos=(N.avisos||[]).concat('A linha digitável do boleto de '+fd(venc)+' não bateu na conferência: confira no boleto.');}
}
function aplicarIA(N,x){
  const c=N.cab,limpa=s=>String(s||'').replace(/\D/g,'');
  if(/^\d{44}$/.test(limpa(x.chave)))c.chave=limpa(x.chave);
  const k=lerChave(c.chave);
  c.numero=c.numero||String(x.numero||k&&k.numero||'');c.serie=c.serie||String(x.serie||k&&k.serie||'');
  c.fornecedor=c.fornecedor||x.fornecedor||'';c.cnpj=c.cnpj||limpa(x.cnpj)||(k?k.cnpj:'');c.emissao=c.emissao||(/^\d{4}-\d\d-\d\d$/.test(x.emissao||'')?x.emissao:'');
  if(x.valor_total&&!c.valor_total)c.valor_total=dec(x.valor_total);
  ['valor_produtos','frete','ipi','st','desconto'].forEach(f=>{if(x[f])c[f]=x[f];});
  if(Array.isArray(x.itens)&&x.itens.length){
    N.itens=x.itens.map(i=>{const e=limpa(i.ean),ean=okEan(e)?e:'',q=+i.qtd||0;
      const it={codigo:String(i.codigo||''),descricao:i.descricao||'',eanCom:ean,eanTrib:'',ean,unidade:i.unidade||'',qtd_nf:q,qTrib:0,
        vprod:+i.valor_total||(+i.valor_unit||0)*q,vdesc:+i.desconto||0,vfrete:0,voutro:0,vipi:+i.ipi||0,vst:+i.st||0,ia:true};
      let m=casarItem(it,c.cnpj);
      if(!m.pid&&i.produto_id&&D.produtos.find(p=>p.id===+i.produto_id))m={pid:+i.produto_id,fator:1,como:'IA (confira)'};
      const fator=m.como==='código do fornecedor'?m.fator:Math.max(1,Math.round(+i.unidades_por_embalagem||1));
      return {...it,pid:m.pid,como:m.como,fator,qtd:Math.round(q*fator),nome:it.descricao,sku:''};});
  }
  if(Array.isArray(x.parcelas)&&x.parcelas.length&&!N.parcelas.length)N.parcelas=x.parcelas.filter(p=>p.vencimento).map(p=>({parcela:p.parcela||'',vencimento:p.vencimento,valor:+p.valor||0,arq:null}));
  N.avisos=(x.avisos||[]).filter(Boolean);
  aplicarBoletosIA(N,x.boletos,null);
  N.lidoIA=true;
}

            try{const c=await anexarNota(nid,p.arq,'boleto');await sb.rpc('anexar_boleto',{p_id:ps[i].id,p_caminho:c,p_nome:p.arq.name.slice(0,150),p_linha:p.linha||''});}catch(e){falhou++;}}}
        NT=null;await carregar();fechar();toast(falhou?'Nota lançada, mas '+falhou+' arquivo(s) não subiram.':'Nota lançada: '+un(itens.reduce((s,i)=>s+i.qtd,0))+' un. em estoque.');modalVerNota(nid);});};
  };
  desenhar();
}

let cpF={st:'aberto',de:'',ate:''};
function situacao(c){const h=hoje();if(c.status==='pago')return `<span class="badge b-rec">Paga ${fd(c.pago_em)}</span>`;
  const d=difDias(c.vencimento,h);if(d<0)return `<span class="badge b-venc">Vencida há ${-d} dia${d===-1?'':'s'}</span>`;if(d===0)return '<span class="badge b-hoje">Vence hoje</span>';return `<span class="meta">em ${d} dia${d===1?'':'s'}</span>`;}
function abaPagar(){
  const h=hoje(),em7=addDias(h,7),mes=h.slice(0,8)+'01',adm=ehAdmin();
  const L=(D.cp||[]).filter(c=>c.status!=='cancelado');const ab=L.filter(c=>c.status==='aberto');
  const soma=a=>a.reduce((s,c)=>s+(+c.valor||0),0);
  const venc=ab.filter(c=>c.vencimento<h),hj=ab.filter(c=>c.vencimento===h),sem=ab.filter(c=>c.vencimento>h&&c.vencimento<=em7);
  const pagoMes=L.filter(c=>c.status==='pago'&&(c.pago_em||'')>=mes);
  let lst=L.filter(c=>cpF.st==='todas'||c.status===cpF.st||(cpF.st==='semboleto'&&c.status==='aberto'&&!c.boleto_caminho)||(cpF.st==='vencidas'&&c.status==='aberto'&&c.vencimento<h)||(cpF.st==='semana'&&c.status==='aberto'&&c.vencimento<=em7))
    .filter(c=>(!cpF.de||c.vencimento>=cpF.de)&&(!cpF.ate||c.vencimento<=cpF.ate)).filter(c=>bate(c.fornecedor,c.descricao,c.parcela,c.obs,dec(c.valor)));
  lst.sort((a,b)=>cpF.st==='pago'?(b.pago_em||'').localeCompare(a.pago_em||''):a.vencimento.localeCompare(b.vencimento));
  const tot=soma(lst);
  const k=(st,n,l,cls)=>`<div class="kpi clk ${cls||''} ${cpF.st===st?'sel':''}" data-cpst="${st}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  return barraBusca('Buscar fornecedor, NF ou valor…',(adm||podeMov()?'<button class="primary" data-act="novacp">+ Conta a pagar</button>':'')+'<button data-act="cpcsv">Exportar</button>')+
  `<div class="resumo">${k('vencidas',brl(soma(venc)),'Vencidas ('+venc.length+')',venc.length?'kv':'')}${k('semana',brl(soma(hj)+soma(sem)+soma(venc)),'Até 7 dias, com vencidas ('+(hj.length+sem.length+venc.length)+')')}${k('aberto',brl(soma(ab)),'Total em aberto ('+ab.length+')')}${k('pago',brl(soma(pagoMes.map(c=>({valor:c.valor_pago??c.valor})))),'Pago no mês ('+pagoMes.length+')')}${k('semboleto',un(ab.filter(c=>!c.boleto_caminho).length),'Sem boleto anexado')}</div>
  <div class="barra" style="align-items:center"><select id="cp_st" style="max-width:200px">${[['aberto','Em aberto'],['vencidas','Vencidas'],['semana','Próximos 7 dias'],['semboleto','Sem boleto'],['pago','Pagas'],['todas','Todas']].map(([a,b])=>`<option value="${a}" ${cpF.st===a?'selected':''}>${b}</option>`).join('')}</select>
   <label class="meta">Vencimento de</label><input id="cp_de" type="date" value="${cpF.de}" style="max-width:160px"><label class="meta">até</label><input id="cp_ate" type="date" value="${cpF.ate}" style="max-width:160px">${cpF.de||cpF.ate?'<button class="small" data-act="cplimpa">Limpar datas</button>':''}</div>
  ${lst.length?`<div class="scroll"><table class="planilha"><tr><th>Vencimento</th><th>Fornecedor</th><th>Descrição</th><th class="n">Valor</th><th>Boleto</th><th>Situação</th><th></th></tr>
  ${lst.map(c=>`<tr class="cl ${c.status==='aberto'&&c.vencimento<h?'venc':''} ${c.status==='pago'?'pago':''}" data-cp="${c.id}"><td><b>${fd(c.vencimento)}</b></td><td>${esc(c.fornecedor||'—')}</td><td>${esc(c.descricao||'')}${c.parcela?' <span class="meta">('+esc(c.parcela)+')</span>':''}</td><td class="n"><b>${brl(c.valor)}</b></td>
    <td>${c.boleto_caminho?`<button class="small" data-cpbol="${c.id}">📎 PDF</button>`:'<span class="semfoto">sem boleto</span>'}${c.linha_digitavel?` <button class="small" data-cplin="${c.id}" title="Copiar linha digitável">📋</button>`:''}</td>
    <td>${situacao(c)}</td><td>${adm&&c.status==='aberto'?`<button class="small primary" data-cppag="${c.id}">Pagar</button>`:''}</td></tr>`).join('')}
  <tr><td colspan="3"><b>Total (${lst.length})</b></td><td class="n"><b>${brl(tot)}</b></td><td colspan="3"></td></tr></table></div>`
  :'<div class="vazio">Nada aqui.</div>'}`;
}

    const v=dinheiro(val('cp_val'));if(!val('cp_ven')){err.textContent='Informe o vencimento.';return;}if(!(v>0)){err.textContent='Informe o valor.';return;}
    rodar($('ok'),async()=>{let cam='',nome='';if(arq){cam=await subirArq('notas',c.nota_id?'n'+c.nota_id:'cp',arq);nome=arq.name.slice(0,150);}
      const nid=await rpc('salvar_conta_pagar',{p:{id:id||null,nota_id:c.nota_id||null,fornecedor:val('cp_for'),descricao:val('cp_des'),parcela:val('cp_par'),vencimento:val('cp_ven'),valor:v,linha:val('cp_lin').replace(/\D/g,''),obs:val('cp_obs'),boleto_caminho:cam,boleto_nome:nome}});
      if(cam&&c.nota_id)await sb.from('nota_anexos').insert({nota_id:c.nota_id,tipo:'boleto',nome,caminho:cam,tamanho:arq.size});
      await carregar();fechar();toast(id?'Conta salva.':'Conta lançada.');});};
}
function modalPagar(id){
  const c=(D.cp||[]).find(x=>x.id===id);if(!c)return;
  abrir(`<h2>Marcar como paga</h2><div class="sub">${esc(c.fornecedor||'')} · ${esc(c.descricao||'')} · vence ${fd(c.vencimento)} · ${brl(c.valor)}</div>
  <div class="duas"><div class="campo"><label>Pago em</label><input id="pg_d" type="date" value="${hoje()}"></div><div class="campo"><label>Valor pago (R$)</label><input id="pg_v" inputmode="decimal" value="${dec(c.valor)}"></div></div>
  <div class="campo"><label>Comprovante <span style="font-weight:400;color:var(--mut)">(opcional)</span></label><input id="pg_arq" type="file" accept="application/pdf,image/*"></div>
  <div class="erro"></div><div class="rodape"><button id="cx">Voltar</button><button class="primary" id="ok">Confirmar pagamento</button></div>`);
  $('cx').onclick=()=>modalConta(id);
  $('ok').onclick=()=>rodar($('ok'),async()=>{const f=$('pg_arq').files[0];let cam='',nome='';if(f){cam=await subirArq('notas','cp',f);nome=f.name.slice(0,150);}
    await rpc('pagar_conta',{p_id:id,p_pago_em:val('pg_d')||hoje(),p_valor:dinheiro(val('pg_v'))||null,p_caminho:cam,p_nome:nome});await carregar();fechar();toast('Pagamento registrado.');});
}

// ================= PORTAL DO CLIENTE =================
let CL={envios:[],contas:[],de:'',ate:'',conta:'',busca:'',aberto:{}};
async function carregarCliente(){
  if(!CL.de){CL.de=addDias(hoje(),-30);CL.ate=hoje();}
  const [e,c]=await Promise.all([sb.rpc('meus_envios',{p_de:CL.de||null,p_ate:CL.ate||null}),sb.rpc('minhas_contas_nomes')]);
  if(e.error)toast(msgErro(e.error));CL.envios=e.data||[];CL.contas=c.data||[];renderCliente();
}
function renderCliente(){
  const q=norm(CL.busca.trim());
  const lst=CL.envios.filter(s=>!CL.conta||String(s.conta_id)===CL.conta).filter(s=>!q||q.split(/\s+/).every(w=>norm('#'+s.id+' '+s.conta+' '+(MODS[s.modalidade]||'')+' '+(s.obs||'')+' '+s.itens.map(i=>i.nome+' '+(i.sku||'')+' '+(i.ean||'')).join(' ')).includes(w)));
  const tu=lst.reduce((a,s)=>a+s.itens.reduce((b,i)=>b+i.qtd,0),0);
  const prods=new Set();lst.forEach(s=>s.itens.forEach(i=>prods.add(i.sku||i.nome)));
  const ativo=document.activeElement&&document.activeElement.id==='cl_busca';
  $('app').innerHTML=`<div class="topo"><div class="wrap"><div class="marca">${LOGO}<div>Envios<small>Acompanhamento de mercadorias enviadas</small></div></div>
    <div class="quem"><span>${esc(perfil.nome||perfil.email)}</span><span class="badge b-pap">Cliente</span><button class="small" data-act="atualizar">Atualizar</button><button class="small" data-act="sair">Sair</button></div></div></div>
    <div class="wrap">${!CL.contas.length?'<div class="vazio" style="margin-top:20px">Seu acesso foi liberado, mas ainda não há contas vinculadas a você. Fale com a Tudo Mix.</div>':`
    <div class="barra" style="align-items:center;margin-top:14px"><input id="cl_busca" type="search" placeholder="Buscar produto, SKU, EAN ou envio…" value="${esc(CL.busca)}">
      ${CL.contas.length>1?`<select id="cl_conta" style="max-width:220px"><option value="">Todas as contas</option>${CL.contas.map(c=>`<option value="${c.id}" ${CL.conta===String(c.id)?'selected':''}>${esc(c.nome)}</option>`).join('')}</select>`:''}
      <label class="meta">De</label><input id="cl_de" type="date" value="${CL.de}" style="max-width:160px"><label class="meta">até</label><input id="cl_ate" type="date" value="${CL.ate}" style="max-width:160px"><button data-act="clcsv">Baixar planilha</button></div>
    <div class="resumo"><div class="kpi"><div class="n">${un(lst.length)}</div><div class="l">Envios no período</div></div><div class="kpi"><div class="n">${un(tu)}</div><div class="l">Unidades enviadas</div></div><div class="kpi"><div class="n">${un(prods.size)}</div><div class="l">Produtos diferentes</div></div></div>
    <div class="lista">${lst.length?lst.map(s=>{const t=s.itens.reduce((b,i)=>b+i.qtd,0),ab=CL.aberto[s.id];return `<div class="card" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;justify-content:space-between;gap:10px;cursor:pointer" data-cltog="${s.id}"><div><div class="t">Envio #${s.id} ${badgeMod(s.modalidade)}</div><div class="meta"><b>${esc(s.conta)}</b> · ${fd(s.data)} · ${s.itens.length} produto(s)${s.anexos.length?' · 🏷 etiqueta':''}${s.obs?' · '+esc(s.obs):''}</div>
      ${ab?'':`<div class="meta">${esc(s.itens.slice(0,3).map(i=>i.nome+' ×'+i.qtd).join(' · '))}${s.itens.length>3?' …':''}</div>`}</div><div class="dir"><div class="n">${un(t)} un.</div><div class="meta">${ab?'fechar ▲':'ver itens ▼'}</div></div></div>
      ${ab?`<div class="scroll" style="margin:10px 0 0"><table class="planilha"><tr><th>Produto</th><th>SKU</th><th>EAN</th><th class="n">Qtd</th></tr>${s.itens.map(i=>`<tr><td>${esc(i.nome)}</td><td>${esc(i.sku||'')}</td><td>${esc(i.ean||'')}</td><td class="n">${un(i.qtd)}</td></tr>`).join('')}<tr><td colspan="3"><b>Total</b></td><td class="n"><b>${un(t)}</b></td></tr></table></div>
      ${s.anexos.map(a=>`<div class="enc"><button class="link" data-clanx="${esc(a.caminho)}">📄 ${esc(a.nome)}</button></div>`).join('')}`:''}</div>`;}).join('')
      :'<div class="vazio">Nenhum envio neste período.</div>'}</div>`}</div>`;
  if(ativo){const b=$('cl_busca');if(b){b.focus();const n=b.value.length;b.setSelectionRange(n,n);}}
}
function csvCliente(){
  const L=[['Envio','Data','Conta','Modalidade','Produto','SKU','EAN','Quantidade','Observação']];
  CL.envios.filter(s=>!CL.conta||String(s.conta_id)===CL.conta).forEach(s=>s.itens.forEach(i=>L.push([s.id,fd(s.data),s.conta,MODS[s.modalidade]||s.modalidade,i.nome,i.sku||'',i.ean||'',i.qtd,s.obs||''])));
  baixarCSV('envios_'+CL.de+'_a_'+CL.ate+'.csv',L);
}

iniciar();
</script>
