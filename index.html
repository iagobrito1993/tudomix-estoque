function fts(s){return s?new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';}
function brl(n,dec=2){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:dec});}
function un(n){return Number(n||0).toLocaleString('pt-BR');}
function num(v){const n=parseInt(String(v??'').replace(/\D/g,''),10);return isNaN(n)?0:n;}
function dinheiro(v){let s=String(v??'').trim().replace(/[R$\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s);}
function um(x){return Array.isArray(x)?x[0]||null:x||null;}
function val(id){const e=$(id);return e?e.value.trim():'';}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),3000);}

function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function msgErro(e){const m=(e&&(e.message||e.error_description))||'Erro inesperado.';
  if(/Invalid login/i.test(m))return 'E-mail ou senha incorretos. Se você ainda não criou sua senha (primeiro acesso), toque em "Esqueci a senha" para receber um link e criar.';
  if(/different from the old/i.test(m))return 'A nova senha precisa ser diferente da anterior.';
  if(/weak|pwned|easy to guess|known to be/i.test(m))return 'Essa senha é muito fácil de adivinhar. Use outra, misturando letras e números.';
  if(/session missing|session_not_found|JWT expired|invalid JWT/i.test(m))return 'Seu link de acesso expirou. Peça um novo em "Esqueci a senha".';
  if(/reauthentication|reauthenticate/i.test(m))return 'Por segurança, entre de novo pelo link do e-mail e crie a senha logo em seguida.';
  if(/Email not confirmed/i.test(m))return 'Confirme seu e-mail antes de entrar (veja sua caixa de entrada).';
  if(/already registered/i.test(m))return 'Este e-mail já tem conta. Use "Entrar".';
  if(/Password should be/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(/row-level security|Unauthorized|not allowed/i.test(m))return 'Seu acesso não permite esta ação.';
  if(/Failed to fetch|NetworkError/i.test(m))return 'Sem conexão com a internet. Tente de novo.';
  return m;}

// fotos
async function reduzirImagem(file,max=1200){
  if(!/^image\//.test(file.type)&&!/\.(jpe?g|png|webp|heic|heif|gif|bmp)$/i.test(file.name||''))throw new Error('Escolha um arquivo de imagem (foto).');
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>er(new Error('Não foi possível abrir esta imagem.'));i.src=url;});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.82));}
  finally{URL.revokeObjectURL(url);}
}
async function enviarFoto(pid,file){
  const blob=await reduzirImagem(file);const caminho='p'+pid+'/'+Date.now()+'.jpg';
  const {error}=await sb.storage.from('produtos').upload(caminho,blob,{contentType:'image/jpeg',upsert:true,cacheControl:'31536000'});
  if(error)throw error;
  const url=sb.storage.from('produtos').getPublicUrl(caminho).data.publicUrl;
  await rpc('definir_foto',{p_produto:pid,p_url:url});
  const p=D.produtos.find(p=>p.id===pid);if(p)p.foto_url=url;return url;
}

function telaLogin(msg){

  $('app').innerHTML=`<div class="login">${LOGO}<h1>Tudo Mix Estoque</h1>
  <div class="sub">${cad?'Crie sua conta de acesso.':rec?'Vamos enviar um link para criar uma nova senha.':'Entre com seu e-mail e senha.'}</div>

    <div class="campo"><label>E-mail</label><input id="l_email" type="email" autocomplete="email" required></div>
    ${rec?'':`<div class="campo"><label>Senha</label><input id="l_senha" type="password" autocomplete="${cad?'new-password':'current-password'}" required minlength="6"></div>`}
    <div class="erro" id="l_erro">${esc(msg||'')}</div>
    <button class="primary" id="l_ok">${cad?'Criar conta':rec?'Enviar link':'Entrar'}</button>

  <div class="alt">${cad||rec?'<button class="link" data-m="entrar">Voltar para entrar</button>':'<button class="link" data-m="criar">Criar conta</button> · <button class="link" data-m="esqueci">Esqueci a senha</button>'}</div></div>`;
  $('app').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{modoLogin=b.dataset.m;telaLogin();});
  $('fl').onsubmit=async e=>{e.preventDefault();const b=$('l_ok');b.disabled=true;$('l_erro').textContent='';
    const email=val('l_email');
    try{
      if(cad){const {data,error}=await sb.auth.signUp({email,password:$('l_senha').value,options:{data:{nome:val('l_nome')},emailRedirectTo:location.origin+location.pathname}});
        if(error)throw error;
        if(!data.session){modoLogin='entrar';telaLogin();$('l_erro').style.color='#15803d';$('l_erro').textContent='Conta criada! Abra o e-mail de confirmação que enviamos, clique no link e depois entre aqui.';return;}}
      else if(rec){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;
        $('l_erro').style.color='#15803d';$('l_erro').textContent='Pronto! Veja seu e-mail e clique no link.';b.disabled=false;return;}
      else{const {error}=await sb.auth.signInWithPassword({email,password:$('l_senha').value});if(error)throw error;}
    }catch(err){$('l_erro').style.color='';$('l_erro').textContent=msgErro(err);b.disabled=false;}
  };

async function carregar(){
  if(perfil&&perfil.papel==='cliente')return carregarCliente();
  if(carregando)return;carregando=true;
  if(perfil&&perfil.papel==='e19'){ // conta só do Estoque 19: catálogo sem custo e os pedidos da unidade
    try{const c=await sb.rpc('e19_catalogo');if(c.error)throw c.error;D.produtos=(c.data||[]).map(p=>({...p,estoque:null}));D.perfis=[];D.contas=[];D.entradas=[];D.saidas=[];D.ajustes=[];D.notas=[];D.cp=[];D.pf=[];
      E04={pode:false,dono:false,saldos:[],movs:[],itens:[],vols:[],sols:[],hist:[],cods:[],acesso:null};await carregarE19();}catch(e){console.error(e);toast('Não foi possível atualizar os dados.');}
    carregando=false;render();e19AbrirLink();return;
  }
  if(perfil&&perfil.papel==='adm'){ // conta só da página ADM TudoMix: não carrega estoque, custos nem outras áreas
    D.produtos=[];D.perfis=[];D.contas=[];D.entradas=[];D.saidas=[];D.ajustes=[];D.notas=[];D.cp=[];D.pf=[];
    E04={pode:false,dono:false,saldos:[],movs:[],itens:[],vols:[],sols:[],hist:[],cods:[],acesso:null};
    await carregarADM();carregando=false;render();return;
  }
  if(perfil&&perfil.papel==='e04'){ // conta só do Estoque 04: não carrega nada do resto do sistema
    try{const [c,pe]=await Promise.all([sb.rpc('e04_catalogo'),sb.rpc('e04_pessoas')]);if(c.error)throw c.error;
      D.produtos=(c.data||[]).map(p=>({...p,estoque:null}));D.perfis=pe.data||[];D.contas=[];D.entradas=[];D.saidas=[];D.ajustes=[];D.notas=[];D.cp=[];D.pf=[];
      await carregarE04();await carregarE19();}catch(e){console.error(e);toast('Não foi possível atualizar os dados.');}
    carregando=false;render();e19AbrirLink();return;
  }
  try{
    const vc=verCusto();
    const [prods,contas,ents,sais,perfis,ajs,nts,cps,pfs]=await Promise.all([
      tudo(()=>sb.from('produtos').select('id,nome,sku,ean,marca,foto_url,estoque,ativo'+(vc?',produtos_custo(custo_medio)':'')).order('nome')),
      sb.from('contas').select('*').order('nome').then(r=>{if(r.error)throw r.error;return r.data;}),
      tudo(()=>sb.from('entradas').select('*'+(vc?',entradas_custo(custo_unit,custo_medio_antes,custo_medio_depois)':'')).neq('origem','olist').order('id',{ascending:false})),
      tudo(()=>sb.from('saidas').select('*,saida_itens(id,produto_id,qtd'+(vc?',saida_itens_custo(custo_medio)':'')+'),saida_anexos(id,nome,caminho,tamanho)').order('id',{ascending:false})),
      sb.from('perfis').select('*').order('nome').then(r=>{if(r.error)throw r.error;return r.data;}),
      sb.from('ajustes').select('*').order('id',{ascending:false}).limit(500).then(r=>r.data||[]),
      tudo(()=>sb.from('notas').select('*,nota_itens(*),nota_anexos(*)'+(vc?',notas_valor(*)':'')).order('id',{ascending:false})).catch(e=>{console.error(e);return [];}),
      vc?tudo(()=>sb.from('contas_pagar').select('*').order('vencimento')).catch(e=>{console.error(e);return [];}):Promise.resolve([]),
      tudo(()=>sb.from('produto_fornecedor').select('*')).catch(()=>[])]);
    D.produtos=prods;D.contas=contas;D.entradas=ents;D.saidas=sais;D.perfis=perfis;D.ajustes=ajs;D.notas=nts;D.cp=cps;D.pf=pfs;
    try{await carregarE04();}catch(e){console.error(e);E04={pode:false,dono:false,saldos:[],movs:[],itens:[],vols:[],sols:[],hist:[],cods:[],acesso:null};}
    try{await carregarE19();}catch(e){console.error(e);}
    if(E04.dono)await carregarADM();
    if(ehAdmin()){const x=await sb.from('acessos').select('*').order('id',{ascending:false}).limit(800);D.acessos=x.data||[];}
  }catch(e){console.error(e);toast('Não foi possível atualizar os dados.');}
  carregando=false;render();e19AbrirLink();
}

let relDe='',relAte='';
function abaRelatorio(){
  if(!relDe){const d=new Date();relDe=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';relAte=hoje();}
  const vc=verCusto();
  const ss=D.saidas.filter(s=>s.status==='ativa'&&s.data>=relDe&&s.data<=relAte);
  const m={};
  ss.forEach(s=>{const k=s.conta_id;m[k]=m[k]||{flex:0,full:0,agencia:0,tot:0,val:0,n:0};m[k][s.modalidade]+=totSaida(s);m[k].tot+=totSaida(s);m[k].val+=custoSaida(s);m[k].n++;});
  const linhas=Object.entries(m).sort((a,b)=>b[1].tot-a[1].tot);
  const T=linhas.reduce((t,[,x])=>{['flex','full','agencia','tot','val','n'].forEach(k=>t[k]+=x[k]);return t;},{flex:0,full:0,agencia:0,tot:0,val:0,n:0});

  ${linhas.length?`<div class="scroll"><table class="planilha"><tr><th>Conta</th><th class="n">Flex</th><th class="n">Full</th><th class="n">Agência</th><th class="n">Total un.</th>${vc?'<th class="n">Valor a custo</th>':''}</tr>
  ${linhas.map(([k,x])=>`<tr><td>${esc(conta(+k).nome)}</td><td class="n">${un(x.flex)}</td><td class="n">${un(x.full)}</td><td class="n">${un(x.agencia)}</td><td class="n"><b>${un(x.tot)}</b></td>${vc?`<td class="n">${brl(x.val)}</td>`:''}</tr>`).join('')}
  <tr><td><b>Total</b></td><td class="n"><b>${un(T.flex)}</b></td><td class="n"><b>${un(T.full)}</b></td><td class="n"><b>${un(T.agencia)}</b></td><td class="n"><b>${un(T.tot)}</b></td>${vc?`<td class="n"><b>${brl(T.val)}</b></td>`:''}</tr></table></div>
  <h3>Produtos que mais saíram</h3><div class="scroll"><table class="planilha"><tr><th>Produto</th><th>SKU</th><th class="n">Unidades</th><th class="n">Em estoque</th></tr>${top.map(([pid,q])=>{const p=produto(+pid);return `<tr class="cl" data-prod="${pid}"><td>${esc(p.nome)}</td><td>${esc(p.sku||'')}</td><td class="n">${un(q)}</td><td class="n">${un(p.estoque)}</td></tr>`;}).join('')}</table></div>`
  :'<div class="vazio">Nenhuma saída neste período.</div>'}`;
}

function acharCodigo(t){t=String(t||'').trim();if(!t)return null;const l=t.toLowerCase();
  return D.produtos.find(p=>(p.sku||'').toLowerCase()===l)||D.produtos.find(p=>(p.ean||'')===t)||null;}
function sugestoes(t,soComEstoque){const q=norm(t.trim());if(q.length<2)return [];const ws=q.split(/\s+/);
  return D.produtos.filter(p=>(!soComEstoque||p.estoque>0)&&ws.every(w=>norm(p.nome+' '+(p.sku||'')+' '+(p.ean||'')+' '+(p.marca||'')).includes(w))).slice(0,12);}
function ligarBusca(inp,box,soComEstoque,escolher){
  const mostrar=()=>{const l=sugestoes(inp.value,soComEstoque);box.innerHTML=l.map(p=>`<div class="sug" data-pid="${p.id}">${foto(p,1)}<div><div>${esc(p.nome)}</div><div class="meta">${esc(p.sku||'')}${p.ean?' · '+esc(p.ean):''}${p.estoque!=null?' · '+un(p.estoque)+' un.':''}</div></div></div>`).join('');box.classList.toggle('hidden',!l.length);};
  inp.addEventListener('input',mostrar);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const p=acharCodigo(inp.value)||(sugestoes(inp.value,soComEstoque).length===1?sugestoes(inp.value,soComEstoque)[0]:null);if(p){box.classList.add('hidden');escolher(p);}}});
  box.addEventListener('mousedown',e=>{const s=e.target.closest('[data-pid]');if(!s)return;e.preventDefault();box.classList.add('hidden');escolher(produto(+s.dataset.pid));});
}

function modalEntrada(pre){
  const adm=ehAdmin();let sel=pre||null;
  abrir(`<h2>Entrada de mercadoria</h2><div class="sub">Busque pelo nome, SKU ou EAN (pode usar o leitor de código de barras).${adm?' O custo médio é recalculado automaticamente.':''}</div>
  <div class="campo"><label>Produto</label><input id="e_busca" placeholder="Nome, SKU ou EAN" autocomplete="off" value="${sel?esc(sel.nome):''}"><div id="e_sug" class="sugs hidden"></div></div>
  <div id="e_novo" class="${sel?'hidden':''}"><div class="meta" style="margin:-4px 0 8px">Produto novo? Preencha SKU e EAN abaixo. Se escolher um produto da lista, estes campos somem.</div>
   <div class="duas"><div class="campo"><label>SKU</label><input id="e_sku"></div><div class="campo"><label>EAN</label><input id="e_ean" inputmode="numeric"></div></div></div>
  <div id="e_sel" class="total ${sel?'':'hidden'}"></div>
  <div class="${adm?'tres':'duas'}"><div class="campo"><label>Quantidade</label><input id="e_qtd" inputmode="numeric"></div>
  ${adm?'<div class="campo"><label>Custo unitário (R$)</label><input id="e_custo" inputmode="decimal" placeholder="opcional"></div>':''}
  <div class="campo"><label>Nota fiscal</label><input id="e_nf"></div></div>
  <div class="duas"><div class="campo"><label>Data</label><input id="e_data" type="date" value="${hoje()}"></div><div class="campo"><label>Observação</label><input id="e_obs"></div></div>
  <div class="total" id="e_prev"></div>
  <div class="erro"></div>
  <div class="rodape"><button id="cx">Cancelar</button><button id="mais">Salvar e lançar outro</button><button class="primary" id="ok">Salvar entrada</button></div>`);
  const prev=()=>{const q=num(val('e_qtd')),c=adm?dinheiro(val('e_custo')):NaN,el=$('e_prev');
    $('e_novo').classList.toggle('hidden',!!sel);$('e_sel').classList.toggle('hidden',!sel);
    if(sel)$('e_sel').innerHTML=`<b>${esc(sel.nome)}</b><br>${esc(sel.sku||'')} · Estoque atual: <b>${un(sel.estoque)} un.</b>${adm?' · Custo médio '+brl(custo(sel),2):''}`;
    if(!q){el.textContent='Informe a quantidade.';return;}
    const q0=sel?sel.estoque:0;let t=`Novo estoque: <b>${un(q0+q)} un.</b>`;
    if(adm&&!isNaN(c)){const c0=sel?custo(sel):0;const nv=q0>0&&c0>0?(q0*c0+q*c)/(q0+q):c;t+=` · Novo custo médio: <b>${brl(nv,2)}</b> · Valor da entrada ${brl(q*c)}`;}
    el.innerHTML=t;};
  ligarBusca($('e_busca'),$('e_sug'),false,p=>{sel=p;$('e_busca').value=p.nome;prev();$('e_qtd').focus();});
  $('e_busca').addEventListener('input',()=>{if(sel&&$('e_busca').value!==sel.nome){sel=null;prev();}});
  ['e_qtd','e_custo'].forEach(id=>$(id)&&$(id).addEventListener('input',prev));prev();
  $('cx').onclick=fechar;
  const salvar=(cont,btn)=>{const q=num(val('e_qtd')),c=adm?dinheiro(val('e_custo')):NaN,err=$('modal').querySelector('.erro');
    if(!sel&&!val('e_busca')){err.textContent='Informe o produto.';return;}
    if(!q){err.textContent='Informe a quantidade.';return;}
    if(!sel&&!val('e_sku')){err.textContent='Produto novo: informe o SKU (ou escolha um produto da lista).';return;}
    rodar(btn,async()=>{await rpc('registrar_entrada',{p_produto_id:sel?sel.id:null,p_nome:sel?null:val('e_busca'),p_sku:sel?null:val('e_sku'),p_ean:sel?null:val('e_ean'),p_qtd:q,p_custo:isNaN(c)?null:c,p_nf:val('e_nf'),p_data:val('e_data')||hoje(),p_obs:val('e_obs')});
      await carregar();toast('Entrada registrada.');if(cont)modalEntrada();else fechar();});};
  $('ok').onclick=()=>salvar(false,$('ok'));$('mais').onclick=()=>salvar(true,$('mais'));
}

let rascunho=null;
function modalSaida(){

async function enviarAnexo(sid,f){
  if(f.size>15e6)throw new Error('Arquivo maior que 15 MB.');
  const ext=(f.name.split('.').pop()||'pdf').toLowerCase().replace(/[^a-z0-9]/g,'');
  const caminho='s'+sid+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
  const {error}=await sb.storage.from('etiquetas').upload(caminho,f,{contentType:f.type||'application/pdf',upsert:false});if(error)throw error;
  const {error:e2}=await sb.from('saida_anexos').insert({saida_id:sid,nome:f.name.slice(0,150),caminho,tamanho:f.size});
  if(e2){sb.storage.from('etiquetas').remove([caminho]).then(()=>{},()=>{});throw e2;}
}

function tg(el,n){return el?el.getElementsByTagNameNS('*',n)[0]||null:null;}

function lerXmlNF(texto){

    return {codigo:tx(p,'cProd'),descricao:tx(p,'xProd'),eanCom:tx(p,'cEAN'),eanTrib:tx(p,'cEANTrib'),unidade:tx(p,'uCom'),
      qtd_nf:nn(tx(p,'qCom')),qTrib:nn(tx(p,'qTrib')),vprod:nn(tx(p,'vProd')),vdesc:nn(tx(p,'vDesc')),vfrete:nn(tx(p,'vFrete')),voutro:nn(tx(p,'vOutro')),

}

// ================= BOLETO (linha digitável) =================
function mod10(s){let soma=0,m=2;for(let i=s.length-1;i>=0;i--){let r=+s[i]*m;if(r>9)r=Math.floor(r/10)+r%10;soma+=r;m=m===2?1:2;}return (10-soma%10)%10;}
function dataFator(f){if(!f)return '';const um=864e5,t=Date.now();const d1=Date.UTC(1997,9,7)+f*um,d2=Date.UTC(2025,1,22)+(f-1000)*um;return new Date(Math.abs(d2-t)<Math.abs(d1-t)?d2:d1).toISOString().slice(0,10);}
function lerLinha(s){const d=String(s||'').replace(/\D/g,'');
  if(d.length===47){if(mod10(d.slice(0,9))!==+d[9]||mod10(d.slice(10,20))!==+d[20]||mod10(d.slice(21,31))!==+d[31])return null;return {linha:d,valor:+d.slice(37)/100,vencimento:dataFator(+d.slice(33,37))};}
  if(d.length===44&&d[0]!=='8')return {linha:d,valor:+d.slice(9,19)/100,vencimento:dataFator(+d.slice(5,9))};
  if(d.length===48&&d[0]==='8'){const b=d.slice(0,11)+d.slice(12,23)+d.slice(24,35)+d.slice(36,47);return {linha:d,valor:+b.slice(4,15)/100,vencimento:''};}
  return null;}
function acharLinha(t){const cs=String(t||'').match(/\d[\d.\s]{44,70}\d/g)||[];
  for(const c of cs){const d=c.replace(/\D/g,'');for(let i=0;i+47<=d.length;i++){const r=lerLinha(d.slice(i,i+47));if(r)return r;}
    for(let i=0;i+48<=d.length;i++){if(d[i]==='8'){const r=lerLinha(d.slice(i,i+48));if(r)return r;}}}
  return null;}
function fmtLinha(l){const d=String(l||'');if(d.length===47)return `${d.slice(0,5)}.${d.slice(5,10)} ${d.slice(10,15)}.${d.slice(15,21)} ${d.slice(21,26)}.${d.slice(26,32)} ${d[32]} ${d.slice(33)}`;return d.replace(/(\d{12})/g,'$1 ').trim();}

  const pdf=await _pdfjs.getDocument({data:await f.arrayBuffer()}).promise;let t='';
  for(let i=1;i<=Math.min(pdf.numPages,3);i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n';}
  return t;}

// ================= IA: melhora a imagem e lê nota/boleto =================
async function melhorarImagem(file){
  if(!/^image\//.test(file.type||''))return file;
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=url;});
    const k=Math.min(1,2400/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    const d=x.getImageData(0,0,w,h),p=d.data,hist=new Uint32Array(256);
    for(let i=0;i<p.length;i+=4){const g=(p[i]*.299+p[i+1]*.587+p[i+2]*.114)|0;p[i]=g;hist[g]++;}
    const tot=w*h;let lo=0,hi=255,a=0;for(let v=0;v<256;v++){a+=hist[v];if(a>tot*.01){lo=v;break;}}a=0;for(let v=255;v>=0;v--){a+=hist[v];if(a>tot*.01){hi=v;break;}}
    const m=hi-lo>20?255/(hi-lo):1;
    for(let i=0;i<p.length;i+=4){let g=(p[i]-lo)*m;g=g<0?0:g>255?255:g;g=255*Math.pow(g/255,1.2);p[i]=p[i+1]=p[i+2]=g;}
    x.putImageData(d,0,0);
    const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.86));
    return new File([blob],(file.name||'foto').replace(/\.[^.]+$/,'')+'-melhorada.jpg',{type:'image/jpeg'});
  }catch(e){console.warn(e);return file;}finally{URL.revokeObjectURL(url);}
}
function b64(f){return new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=er;r.readAsDataURL(f);});}
async function pdfParaImagens(f){
  await textoPdf(f).catch(()=>'');const pdf=await _pdfjs.getDocument({data:await f.arrayBuffer()}).promise;const out=[];
  for(let i=1;i<=Math.min(pdf.numPages,6);i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:2});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const b=await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.9));out.push(new File([b],'pagina'+i+'.jpg',{type:'image/jpeg'}));}
  return out;}
async function prepararIA(files){

function modalNota(){
  NT=NT||novaNT();const N=NT,adm=ehAdmin(),vc=verCusto(),M2=()=>$('modal');
  const guardar=()=>{if(!$('n_num'))return;Object.assign(N.cab,{numero:val('n_num'),serie:val('n_ser'),fornecedor:val('n_for'),cnpj:val('n_cnpj'),emissao:val('n_emi'),recebida:val('n_rec')||hoje(),obs:val('n_obs')});
    if($('n_tot'))N.cab.valor_total=val('n_tot');if($('n_chave'))N.cab.chave=val('n_chave').replace(/\D/g,'');};
  const desenhar=()=>{
    const totU=N.itens.reduce((s,i)=>s+(i.qtd||0),0);
    const totV=N.itens.reduce((s,i)=>{const c=custoItem(i,N.incluirImp);return s+(c?c*(i.qtd||0):0);},0);
    abrir(`<h2>Lançar nota fiscal</h2><div class="sub">Com o <b>XML</b> (vem no e-mail do fornecedor) os produtos, quantidades, custos e vencimentos entram sozinhos. Sem XML, leia a chave com o leitor e lance os produtos à mão.</div>
    <div class="caixa-up">
      <label class="up"><input id="n_xml" type="file" accept=".xml,text/xml,application/xml" class="hidden"><span class="ic">🧾</span><b>${N.xml?esc(N.xml.name):'Escolher XML da nota'}</b><span class="meta">${N.xml?'XML lido':'leitura automática'}</span></label>
      <label class="up"><input id="n_foto" type="file" accept="image/*,application/pdf" capture="environment" multiple class="hidden"><span class="ic">📷</span><b>Foto / PDF da nota</b><span class="meta">a IA lê sozinha</span><span class="meta">${N.arqs.filter(a=>a.tipo==='nf').length} arquivo(s)</span></label>
      <label class="up"><input id="n_bol" type="file" accept="application/pdf,image/*" multiple class="hidden"><span class="ic">💳</span><b>Boletos</b><span class="meta">${N.arqs.filter(a=>a.tipo==='boleto').length+N.parcelas.filter(p=>p.arq).length} arquivo(s)</span></label>
    </div>
    ${N.lendo?'<div class="ia-lendo">🤖 <b>Lendo a nota com IA…</b> melhorando a imagem e conferindo produtos, parcelas e boletos (10 a 60 segundos).</div>':''}
    ${N.lidoIA&&!N.lendo?`<div class="ia-ok">🤖 Nota lida pela IA. <b>Confira</b> os produtos e as quantidades antes de lançar.${N.arqs.some(a=>a.tipo==='nf')?' <button class="link small" id="n_ia">Ler de novo</button>':''}</div>`:(!N.lendo&&!N.doXml&&N.arqs.some(a=>a.tipo==='nf')?'<div class="ia-ok"><button class="primary small" id="n_ia">🤖 Ler a nota com IA</button></div>':'')}
    ${N.avisos&&N.avisos.length?`<div class="ia-av">⚠️ ${N.avisos.map(esc).join('<br>⚠️ ')}</div>`:''}
    <div class="campo"><label>Chave de acesso <span style="font-weight:400;color:var(--mut)">(leitor de código de barras no DANFE)</span></label><input id="n_chave" inputmode="numeric" value="${esc(N.cab.chave)}" placeholder="44 números"></div>
    <div class="tres"><div class="campo"><label>Número da NF</label><input id="n_num" value="${esc(N.cab.numero)}"></div><div class="campo"><label>Série</label><input id="n_ser" value="${esc(N.cab.serie)}"></div><div class="campo"><label>Recebida em</label><input id="n_rec" type="date" value="${esc(N.cab.recebida)}"></div></div>
    <div class="tres"><div class="campo"><label>Fornecedor</label><input id="n_for" value="${esc(N.cab.fornecedor)}"></div><div class="campo"><label>CNPJ</label><input id="n_cnpj" value="${esc(N.cab.cnpj)}"></div><div class="campo"><label>Emissão</label><input id="n_emi" type="date" value="${esc(N.cab.emissao)}"></div></div>
    ${vc?`<div class="duas"><div class="campo"><label>Valor total da nota (R$)</label><input id="n_tot" inputmode="decimal" value="${esc(N.cab.valor_total)}"></div><div class="campo"><label>Observação</label><input id="n_obs" value="${esc(N.cab.obs)}"></div></div>`:`<div class="campo"><label>Observação</label><input id="n_obs" value="${esc(N.cab.obs)}"></div>`}
    <h3>Produtos (${N.itens.length})</h3>
    ${N.itens.length?`<div class="scroll"><table class="planilha nt"><tr><th>Produto no estoque</th><th>Na nota</th><th class="n">Qtd NF</th><th class="n">× Un. por cx</th><th class="n">= Unidades</th>${adm?'<th class="n">Custo unit.</th>':''}<th></th></tr>
    ${N.itens.map((it,ix)=>{const p=it.pid?produto(it.pid):null;const c=custoItem(it,N.incluirImp);
      return `<tr><td style="white-space:normal;min-width:220px">${it.trocando?`<input id="nb_${ix}" placeholder="Buscar produto" autocomplete="off"><div id="nbs_${ix}" class="sugs hidden"></div><button class="link small" data-novo="${ix}">Criar como produto novo</button>`
        :p?`<div class="pinfo">${foto(p,1)}<div><b>${esc(p.nome)}</b><div class="meta">${esc(p.sku||'')} · estoque ${un(p.estoque)}${it.como?' · achado por '+it.como:''}</div><button class="link small" data-troca="${ix}">trocar</button></div></div>`
        :`<div class="warn">Produto novo</div><input data-nnome="${ix}" value="${esc(it.nome)}" style="margin-top:4px"><input data-nsku="${ix}" value="${esc(it.sku||'')}" placeholder="SKU (opcional)" style="margin-top:4px"><button class="link small" data-troca="${ix}">é um produto que já existe</button>`}</td>
        <td style="white-space:normal;max-width:240px"><div class="meta" style="margin:0">${esc(it.descricao||'')}${it.codigo?'<br>Cód. '+esc(it.codigo):''}${it.ean?' · EAN '+esc(it.ean):''}</div></td>
        <td class="n">${it.manual?'—':un(it.qtd_nf)+' '+esc(it.unidade||'')}</td>
        <td class="n">${it.manual?'—':`<input data-nfat="${ix}" value="${it.fator}" inputmode="numeric" style="width:64px;text-align:right">`}</td>
        <td class="n"><input data-nqtd="${ix}" value="${it.qtd||''}" inputmode="numeric" style="width:80px;text-align:right"></td>
        ${adm?`<td class="n">${it.manual?`<input data-ncus="${ix}" value="${it.custo!=null?dec(it.custo):''}" inputmode="decimal" style="width:90px;text-align:right" placeholder="opcional">`:(c!=null?brl(c,4):'—')}</td>`:''}
        <td><button class="small danger" data-nrm="${ix}">✕</button></td></tr>`;}).join('')}</table></div>`:'<div class="vazio" style="padding:16px">Escolha o XML ou adicione os produtos abaixo.</div>'}
    <div class="campo"><label>Adicionar produto à mão</label><input id="n_busca" placeholder="Nome, SKU ou EAN (leitor)" autocomplete="off"><div id="n_sug" class="sugs hidden"></div></div>
    ${adm&&(N.doXml||N.lidoIA)?`<label class="meta" style="display:flex;gap:8px;align-items:center;margin:4px 0 8px"><input type="checkbox" id="n_imp" style="width:auto" ${N.incluirImp?'checked':''}> Somar IPI, ST e frete no custo dos produtos (padrão: só o valor unitário do produto)</label>`:''}
    <h3>Parcelas / boletos (${N.parcelas.length})</h3>
    ${N.parcelas.length?`<div class="tab">${N.parcelas.map((p,ix)=>`<div class="lin"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input data-pv="${ix}" type="date" value="${esc(p.vencimento)}" style="width:150px">${vc?`<input data-pval="${ix}" value="${p.valor?dec(p.valor):''}" inputmode="decimal" placeholder="Valor" style="width:110px">`:''}<span class="meta">${esc(p.parcela||'Parcela '+(ix+1))}</span></div>
      <div style="display:flex;gap:6px;align-items:center"><label class="small btnf">${p.arq?'📎 '+esc(p.arq.name.slice(0,22)):'Anexar boleto'}<input type="file" data-parq="${ix}" accept="application/pdf,image/*" class="hidden"></label><button class="small danger" data-prm="${ix}">✕</button></div></div>`).join('')}</div>`:'<div class="meta">Nenhuma parcela. Se a nota tem boleto, adicione a parcela para ele aparecer no contas a pagar.</div>'}
    <button class="small" id="n_addp" style="margin-top:6px">+ Parcela</button>
    ${N.arqs.length?`<h3>Arquivos</h3>${N.arqs.map((a,ix)=>`<div class="enc"><span>${a.tipo==='boleto'?'💳':'📄'} ${esc(a.f.name)} <span class="badge b-can">${TIPOS_ANX[a.tipo]}</span></span><button class="small danger" data-arm="${ix}">Remover</button></div>`).join('')}`:''}
    <div class="total">Total: <b>${un(totU)} un.</b> em ${N.itens.length} produto(s)${adm&&totV?' · Custo dos produtos <b>'+brl(totV)+'</b>':''}${vc&&N.cab.valor_total?' · Valor da nota '+brl(dinheiro(N.cab.valor_total)):''}</div>
    <div class="erro"></div>
    <div class="rodape"><button id="cx">Fechar</button><button class="danger" id="n_limpar">Limpar</button><button class="primary" id="ok">Lançar nota e dar entrada</button></div>`,true);
    const M=$('modal');
    ['n_num','n_ser','n_for','n_cnpj','n_emi','n_rec','n_obs','n_tot'].forEach(id=>$(id)&&$(id).addEventListener('change',guardar));
    $('n_chave').addEventListener('input',()=>{const c=lerChave($('n_chave').value);if(!c)return;guardar();N.cab.chave=c.chave;if(!N.cab.numero)N.cab.numero=c.numero;if(!N.cab.serie)N.cab.serie=c.serie;if(!N.cab.cnpj)N.cab.cnpj=c.cnpj;
      const dup=D.notas.find(n=>n.chave===c.chave);desenhar();if(dup)M.querySelector('.erro').textContent='Atenção: esta nota já foi lançada (NF '+(dup.numero||'')+').';else $('n_num').focus();});
    $('n_xml').onchange=async()=>{const f=$('n_xml').files[0];if(!f)return;guardar();
      try{const x=lerXmlNF(await f.text());
        if(D.notas.find(n=>n.chave&&n.chave===x.chave))throw new Error('Esta nota já foi lançada (NF '+x.numero+').');
        N.xml=f;N.doXml=true;Object.assign(N.cab,{chave:x.chave,numero:x.numero,serie:x.serie,fornecedor:x.fornecedor,cnpj:x.cnpj,emissao:x.emissao,valor_total:x.valor_total?dec(x.valor_total):'',valor_produtos:x.valor_produtos,frete:x.frete,ipi:x.ipi,st:x.st,desconto:x.desconto});
        N.itens=x.itens.map(it=>{const m=casarItem(it,x.cnpj);const ean=okEan(it.eanCom)?it.eanCom:okEan(it.eanTrib)?it.eanTrib:'';
          return {...it,ean,pid:m.pid,como:m.como,fator:m.fator,qtd:Math.round(it.qtd_nf*m.fator),nome:it.descricao,sku:''};});
        if(x.parcelas.length)N.parcelas=x.parcelas.map(p=>({...p,arq:null}));
        else if(!N.parcelas.length&&x.valor_total)N.parcelas=[];
        desenhar();const novos=N.itens.filter(i=>!i.pid).length;toast('XML lido: '+N.itens.length+' produto(s)'+(novos?', '+novos+' novo(s) — confira':'')+'.');
      }catch(e){desenhar();M.querySelector('.erro').textContent=msgErro(e);}};
    const lerIA=async()=>{const fs=N.arqs.filter(a=>a.tipo==='nf').map(a=>a.f);if(!fs.length)return;guardar();N.lendo=true;desenhar();
      try{const x=await lerComIA('nota',fs);
        if(x.chave&&D.notas.find(n=>n.chave&&n.chave===String(x.chave).replace(/\D/g,''))){N.lendo=false;desenhar();M2().querySelector('.erro').textContent='Atenção: esta nota já foi lançada (NF '+(x.numero||'')+').';return;}
        aplicarIA(N,x);N.lendo=false;desenhar();const novos=N.itens.filter(i=>!i.pid).length;toast('IA leu '+N.itens.length+' produto(s)'+(novos?', '+novos+' sem cadastro':'')+'. Confira antes de lançar.');}
      catch(e){N.lendo=false;desenhar();M2().querySelector('.erro').textContent=msgErro(e);}};
    if($('n_ia'))$('n_ia').onclick=()=>{N.lidoIA=false;N.parcelas=N.parcelas.filter(p=>p.arq);lerIA();};
    $('n_foto').onchange=async()=>{guardar();const fs=[...$('n_foto').files];for(const f of fs)N.arqs.push({f:await melhorarImagem(f),tipo:'nf'});
      if(!N.doXml)lerIA();else desenhar();};
    $('n_bol').onchange=async()=>{guardar();const fs=[];for(const f0 of $('n_bol').files)fs.push(await melhorarImagem(f0));N.lendo=true;desenhar();
      for(const f of fs){const l=await lerBoleto(f);const sem=(l&&l.vencimento&&N.parcelas.find(p=>!p.arq&&p.vencimento===l.vencimento))||N.parcelas.find(p=>!p.arq);
        if(sem){sem.arq=f;if(l)sem.linha=l.linha;}
        else{N.parcelas.push({parcela:'',vencimento:l&&l.vencimento||'',valor:l?l.valor:0,linha:l?l.linha:'',arq:f});}
        if(!l)N.avisos=(N.avisos||[]).concat('Não consegui ler o boleto '+f.name+': confira valor e vencimento.');}
      N.lendo=false;desenhar();};
    M.querySelectorAll('[data-parq]').forEach(inp=>inp.onchange=async()=>{guardar();if(!inp.files[0])return;const f=await melhorarImagem(inp.files[0]);const p=N.parcelas[+inp.dataset.parq];p.arq=f;N.lendo=true;desenhar();const l=await lerBoleto(f);N.lendo=false;
      if(l){p.linha=l.linha;if(!p.vencimento&&l.vencimento)p.vencimento=l.vencimento;if(!p.valor)p.valor=l.valor;}desenhar();});
    M.querySelectorAll('[data-pv]').forEach(i=>i.onchange=()=>{N.parcelas[+i.dataset.pv].vencimento=i.value;});
    M.querySelectorAll('[data-pval]').forEach(i=>i.onchange=()=>{N.parcelas[+i.dataset.pval].valor=dinheiro(i.value)||0;});
    M.querySelectorAll('[data-prm]').forEach(b=>b.onclick=()=>{guardar();N.parcelas.splice(+b.dataset.prm,1);desenhar();});
    M.querySelectorAll('[data-arm]').forEach(b=>b.onclick=()=>{guardar();N.arqs.splice(+b.dataset.arm,1);desenhar();});
    $('n_addp').onclick=()=>{guardar();N.parcelas.push({parcela:'',vencimento:'',valor:0,arq:null});desenhar();};
    M.querySelectorAll('[data-nfat]').forEach(i=>i.onchange=()=>{const it=N.itens[+i.dataset.nfat];it.fator=Math.max(1,num(i.value)||1);it.qtd=Math.round(it.qtd_nf*it.fator);guardar();desenhar();});
    M.querySelectorAll('[data-nqtd]').forEach(i=>i.onchange=()=>{N.itens[+i.dataset.nqtd].qtd=num(i.value);guardar();desenhar();});
    M.querySelectorAll('[data-ncus]').forEach(i=>i.onchange=()=>{const v=dinheiro(i.value);N.itens[+i.dataset.ncus].custo=isNaN(v)?null:v;guardar();desenhar();});
    M.querySelectorAll('[data-nnome]').forEach(i=>i.onchange=()=>{N.itens[+i.dataset.nnome].nome=i.value;});
    M.querySelectorAll('[data-nsku]').forEach(i=>i.onchange=()=>{N.itens[+i.dataset.nsku].sku=i.value;});
    M.querySelectorAll('[data-nrm]').forEach(b=>b.onclick=()=>{guardar();N.itens.splice(+b.dataset.nrm,1);desenhar();});
    M.querySelectorAll('[data-troca]').forEach(b=>b.onclick=()=>{guardar();N.itens[+b.dataset.troca].trocando=true;desenhar();const i=$('nb_'+b.dataset.troca);if(i)i.focus();});
    M.querySelectorAll('[data-novo]').forEach(b=>b.onclick=()=>{guardar();const it=N.itens[+b.dataset.novo];it.trocando=false;it.pid=null;it.como='';desenhar();});
    N.itens.forEach((it,ix)=>{if(it.trocando&&$('nb_'+ix))ligarBusca($('nb_'+ix),$('nbs_'+ix),false,p=>{it.pid=p.id;it.como='escolhido';it.trocando=false;desenhar();});});
    if($('n_imp'))$('n_imp').onchange=()=>{guardar();N.incluirImp=$('n_imp').checked;desenhar();};
    ligarBusca($('n_busca'),$('n_sug'),false,p=>{guardar();const ex=N.itens.find(i=>i.pid===p.id&&i.manual);if(ex)ex.qtd=(ex.qtd||0)+1;else N.itens.push({manual:true,pid:p.id,qtd:1,custo:null,descricao:'',fator:1});desenhar();setTimeout(()=>{const q=M.querySelector('[data-nqtd="'+N.itens.findIndex(i=>i.pid===p.id&&i.manual)+'"]');if(q){q.focus();q.select();}},40);});
    $('cx').onclick=()=>{guardar();fechar();};
    $('n_limpar').onclick=()=>{NT=null;modalNota();};
    $('ok').onclick=()=>{guardar();const err=M.querySelector('.erro');err.textContent='';if(N.lendo){err.textContent='Aguarde a leitura terminar.';return;}
      const itens=N.itens.filter(i=>(i.qtd||0)>0);
      if(!N.cab.numero&&!N.cab.chave){err.textContent='Informe o número da nota (ou leia a chave / o XML).';return;}
      if(!itens.length){err.textContent='Nenhum produto com quantidade.';return;}
      const semNome=itens.find(i=>!i.pid&&!String(i.nome||'').trim());if(semNome){err.textContent='Dê um nome ao produto novo.';return;}
      const parc=N.parcelas.filter(p=>p.vencimento).sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
      if(vc&&parc.some(p=>!(p.valor>0))){err.textContent='Informe o valor de todas as parcelas.';return;}
      const corpo={...N.cab,cnpj:String(N.cab.cnpj||'').replace(/\D/g,''),valor_total:vc?dinheiro(N.cab.valor_total)||null:(N.cab.valor_total?dinheiro(N.cab.valor_total):null),
        itens:itens.map(i=>({produto_id:i.pid,nome:i.nome||i.descricao,sku:i.sku||'',ean:i.ean||'',codigo:i.codigo||'',descricao:i.descricao||'',unidade:i.unidade||'',qtd_nf:i.qtd_nf||null,fator:i.fator||1,qtd:i.qtd,custo:custoItem(i,N.incluirImp)})),
        parcelas:parc.map(p=>({parcela:p.parcela,vencimento:p.vencimento,valor:p.valor}))};
      rodar($('ok'),async()=>{
        const nid=await rpc('registrar_nota',{p:corpo});let falhou=0;
        if(N.xml){try{await anexarNota(nid,N.xml,'xml');}catch(e){falhou++;}}
        for(const a of N.arqs){try{await anexarNota(nid,a.f,a.tipo);}catch(e){falhou++;}}
        const comArq=parc.filter(p=>p.arq);
        if(comArq.length){const {data:ps}=await sb.rpc('parcelas_da_nota',{p_nota:nid});
          for(let i=0;i<parc.length;i++){const p=parc[i];if(!p.arq||!ps||!ps[i])continue;
            try{const c=await anexarNota(nid,p.arq,'boleto');await sb.rpc('anexar_boleto',{p_id:ps[i].id,p_caminho:c,p_nome:p.arq.name.slice(0,150),p_linha:p.linha||''});}catch(e){falhou++;}}}
        NT=null;await carregar();fechar();toast(falhou?'Nota lançada, mas '+falhou+' arquivo(s) não subiram.':'Nota lançada: '+un(itens.reduce((s,i)=>s+i.qtd,0))+' un. em estoque.');modalVerNota(nid);});};
  };
  desenhar();
}

// ================= NOTAS (lista e detalhe) =================
function parcelasNota(nid){return (D.cp||[]).filter(c=>c.nota_id===nid);}
function abaNotas(){
  const vc=verCusto(),h=hoje(),mes=h.slice(0,8)+'01';
  const lst=D.notas.filter(n=>bate('NF '+(n.numero||''),n.fornecedor,n.chave,n.obs,...(n.nota_itens||[]).map(i=>{const p=produto(i.produto_id);return p.nome+' '+(p.sku||'')+' '+(p.ean||'');})));
  const doMes=D.notas.filter(n=>n.recebida_em>=mes);
  const uMes=doMes.reduce((s,n)=>s+(n.nota_itens||[]).reduce((a,i)=>a+(i.qtd||0),0),0);
  const vMes=doMes.reduce((s,n)=>s+(+(um(n.notas_valor)||{}).valor_total||0),0);
  const semBol=vc?(D.cp||[]).filter(c=>c.status==='aberto'&&!c.boleto_caminho).length:0;
  return barraBusca('Buscar nota, fornecedor ou produto…',podeMov()?'<button class="primary" data-act="nota">+ Lançar nota</button>':'')+
  `<div class="resumo"><div class="kpi"><div class="n">${un(doMes.length)}</div><div class="l">Notas recebidas no mês</div></div><div class="kpi"><div class="n">${un(uMes)}</div><div class="l">Unidades que entraram no mês</div></div>
   ${vc?`<div class="kpi"><div class="n">${brl(vMes)}</div><div class="l">Valor das notas no mês</div></div><div class="kpi clk" data-aba="pagar"><div class="n">${un(semBol)}</div><div class="l">Parcelas sem boleto anexado</div></div>`:''}</div>
  <div class="lista">${lst.length?lst.slice(0,limite).map(n=>{const it=n.nota_itens||[],ax=n.nota_anexos||[],ps=parcelasNota(n.id);const v=um(n.notas_valor);
    const temNF=ax.some(a=>a.tipo==='nf'||a.tipo==='xml');
    return `<div class="card click" data-nota="${n.id}"><div><div class="t">NF ${esc(n.numero||'s/n')}${n.serie?'<span class="meta"> · série '+esc(n.serie)+'</span>':''} · ${esc(n.fornecedor||'Fornecedor não informado')}</div>
    <div class="meta">Recebida ${fd(n.recebida_em)}${n.emissao?' · emitida '+fd(n.emissao):''} · ${it.length} produto(s)${nomeDe(n.criado_por)?' · por '+esc(nomeDe(n.criado_por)):''}</div>

let cpF={st:'aberto',de:'',ate:''};
function situacao(c){const h=hoje();if(c.status==='pago')return `<span class="badge b-rec">Paga ${fd(c.pago_em)}</span>`;
  const d=difDias(c.vencimento,h);if(d<0)return `<span class="badge b-venc">Vencida há ${-d} dia${d===-1?'':'s'}</span>`;if(d===0)return '<span class="badge b-hoje">Vence hoje</span>';return `<span class="meta">em ${d} dia${d===1?'':'s'}</span>`;}
function abaPagar(){
  const h=hoje(),em7=addDias(h,7),mes=h.slice(0,8)+'01',adm=ehAdmin();
  const L=(D.cp||[]).filter(c=>c.status!=='cancelado');const ab=L.filter(c=>c.status==='aberto');
  const soma=a=>a.reduce((s,c)=>s+(+c.valor||0),0);
  const venc=ab.filter(c=>c.vencimento<h),hj=ab.filter(c=>c.vencimento===h),sem=ab.filter(c=>c.vencimento>h&&c.vencimento<=em7);
  const pagoMes=L.filter(c=>c.status==='pago'&&(c.pago_em||'')>=mes);
  let lst=L.filter(c=>cpF.st==='todas'||c.status===cpF.st||(cpF.st==='semboleto'&&c.status==='aberto'&&!c.boleto_caminho)||(cpF.st==='vencidas'&&c.status==='aberto'&&c.vencimento<h)||(cpF.st==='semana'&&c.status==='aberto'&&c.vencimento<=em7))
    .filter(c=>(!cpF.de||c.vencimento>=cpF.de)&&(!cpF.ate||c.vencimento<=cpF.ate)).filter(c=>bate(c.fornecedor,c.descricao,c.parcela,c.obs,dec(c.valor)));
  lst.sort((a,b)=>cpF.st==='pago'?(b.pago_em||'').localeCompare(a.pago_em||''):a.vencimento.localeCompare(b.vencimento));
  const tot=soma(lst);
  const k=(st,n,l,cls)=>`<div class="kpi clk ${cls||''} ${cpF.st===st?'sel':''}" data-cpst="${st}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
  return barraBusca('Buscar fornecedor, NF ou valor…',(adm||podeMov()?'<button class="primary" data-act="novacp">+ Conta a pagar</button>':'')+'<button data-act="cpcsv">Exportar</button>')+
  `<div class="resumo">${k('vencidas',brl(soma(venc)),'Vencidas ('+venc.length+')',venc.length?'kv':'')}${k('semana',brl(soma(hj)+soma(sem)+soma(venc)),'Até 7 dias, com vencidas ('+(hj.length+sem.length+venc.length)+')')}${k('aberto',brl(soma(ab)),'Total em aberto ('+ab.length+')')}${k('pago',brl(soma(pagoMes.map(c=>({valor:c.valor_pago??c.valor})))),'Pago no mês ('+pagoMes.length+')')}${k('semboleto',un(ab.filter(c=>!c.boleto_caminho).length),'Sem boleto anexado')}</div>
  <div class="barra" style="align-items:center"><select id="cp_st" style="max-width:200px">${[['aberto','Em aberto'],['vencidas','Vencidas'],['semana','Próximos 7 dias'],['semboleto','Sem boleto'],['pago','Pagas'],['todas','Todas']].map(([a,b])=>`<option value="${a}" ${cpF.st===a?'selected':''}>${b}</option>`).join('')}</select>
   <label class="meta">Vencimento de</label><input id="cp_de" type="date" value="${cpF.de}" style="max-width:160px"><label class="meta">até</label><input id="cp_ate" type="date" value="${cpF.ate}" style="max-width:160px">${cpF.de||cpF.ate?'<button class="small" data-act="cplimpa">Limpar datas</button>':''}</div>
  ${lst.length?`<div class="scroll"><table class="planilha"><tr><th>Vencimento</th><th>Fornecedor</th><th>Descrição</th><th class="n">Valor</th><th>Boleto</th><th>Situação</th><th></th></tr>
  ${lst.map(c=>`<tr class="cl ${c.status==='aberto'&&c.vencimento<h?'venc':''} ${c.status==='pago'?'pago':''}" data-cp="${c.id}"><td><b>${fd(c.vencimento)}</b></td><td>${esc(c.fornecedor||'—')}</td><td>${esc(c.descricao||'')}${c.parcela?' <span class="meta">('+esc(c.parcela)+')</span>':''}</td><td class="n"><b>${brl(c.valor)}</b></td>
    <td>${c.boleto_caminho?`<button class="small" data-cpbol="${c.id}">📎 PDF</button>`:'<span class="semfoto">sem boleto</span>'}${c.linha_digitavel?` <button class="small" data-cplin="${c.id}" title="Copiar linha digitável">📋</button>`:''}</td>
    <td>${situacao(c)}</td><td>${adm&&c.status==='aberto'?`<button class="small primary" data-cppag="${c.id}">Pagar</button>`:''}</td></tr>`).join('')}
  <tr><td colspan="3"><b>Total (${lst.length})</b></td><td class="n"><b>${brl(tot)}</b></td><td colspan="3"></td></tr></table></div>`
  :'<div class="vazio">Nada aqui.</div>'}`;
}

  if($('cp_vcomp'))$('cp_vcomp').onclick=()=>abrirArq('notas',c.comprovante_caminho);
  if($('cp_cop'))$('cp_cop').onclick=()=>copiar(c.linha_digitavel);

  if($('cp_arq'))$('cp_arq').onchange=async()=>{arq=$('cp_arq').files[0];if(!arq)return;$('cp_lido').textContent='🤖 Lendo o boleto…';arq=await melhorarImagem(arq);const l=await lerBoleto(arq);

let CL={envios:[],contas:[],de:'',ate:'',conta:'',busca:'',aberto:{}};
async function carregarCliente(){
  if(!CL.de){CL.de=addDias(hoje(),-30);CL.ate=hoje();}
  const [e,c]=await Promise.all([sb.rpc('meus_envios',{p_de:CL.de||null,p_ate:CL.ate||null}),sb.rpc('minhas_contas_nomes')]);
  if(e.error)toast(msgErro(e.error));CL.envios=e.data||[];CL.contas=c.data||[];renderCliente();
}

function e04Achar(cod){
  cod=limpaCod(cod);if(!cod)return [];

    ['u_nome','u_sku'].forEach(id=>$(id).addEventListener('input',parecidos));

// arredonda em centavos como o banco (metade se afasta do zero)
function e04R2(x){return Math.sign(x)*Math.round(Math.abs(x)*100+1e-9)/100;}
// mesmo cálculo do servidor (e04_ratear): cada valor do pedido entra uma única vez, rateado pelo subtotal da linha
function e04Calcular(itens,d){
  const lin=itens.map(i=>{const q=+i.qtd||0,cu=e04Num(i.cu);return {q,cu,ok:q>0&&cu!==null&&!Number.isNaN(cu)&&cu>=0,sub:q>0&&cu>=0?e04R2(q*cu):0};});
  const v=k=>{const n=e04Num(d[k]);return n===null?0:n;},pct=v('pct'),fr=v('frete'),tx=v('tx'),co=v('co'),te=v('te');
  let erro='';
  if([pct,fr,tx,co,te].some(Number.isNaN))erro='Confira os valores digitados em Acerto e transporte.';
  else if(pct<0||pct>1000)erro='Percentual do acerto inválido.';
  else if(d.tipo==='desconto'&&pct>100)erro='Desconto não pode passar de 100%.';
  else if([fr,tx,co,te].some(x=>x<0))erro='Transporte, taxa, comissão e taxa extra não podem ser negativos.';
  const S=e04R2(lin.reduce((a,l)=>a+l.sub,0)),AC=erro?0:e04R2(S*pct/100)*(d.tipo==='desconto'?-1:1);
  const usaQ=S===0,w=lin.map(l=>usaQ?l.q:l.sub),tw=w.reduce((a,b)=>a+b,0);
  const rat=V=>{let cw=0;return w.map(x=>{const a=tw?e04R2(V*(cw+x)/tw)-e04R2(V*cw/tw):0;cw+=x;return e04R2(a);});};
  const ra=rat(AC),rf=rat(erro?0:fr),rt=rat(erro?0:tx),rc=rat(erro?0:co),re=rat(erro?0:te);
  const L=lin.map((l,k)=>{const dsp=e04R2(rt[k]+rc[k]+re[k]),tot=e04R2(l.sub+ra[k]+rf[k]+dsp);return {...l,ac:ra[k],fr:rf[k],tx:rt[k],co:rc[k],te:re[k],dsp,tot,fin:l.q>0?tot/l.q:0};});
  return {L,S,AC,pct,fr,tx,co,te,erro,dsp:e04R2(tx+co+te),tot:e04R2(L.reduce((a,l)=>a+l.tot,0)),qt:lin.reduce((a,l)=>a+l.q,0),ok:!erro&&lin.length>0&&lin.every(l=>l.ok)};
}

      <div style="display:flex;gap:6px;align-items:center"><label class="small btnf">${arqs[k]?'📎 '+esc(arqs[k].name.slice(0,18)):'Anexar PDF/imagem'}<input type="file" data-va="${k}" accept="application/pdf,image/*" class="hidden"></label><button class="small danger" data-vrm="${k}">✕</button></div></div>`).join('')}</div>`:'<div class="meta">Nenhuma etiqueta registrada.</div>'}

    M.querySelectorAll('[data-vrm]').forEach(b=>b.onclick=()=>{const k=+b.dataset.vrm;R.vols.splice(k,1);for(let x=k;x<R.vols.length+1;x++)arqs[x]=arqs[x+1];salvar();desenhar();});
    M.querySelectorAll('[data-va]').forEach(inp=>inp.onchange=async()=>{const f=inp.files[0];if(f)arqs[+inp.dataset.va]=await melhorarImagem(f);desenhar();});
    const g=(id,k)=>$(id).addEventListener('input',()=>{R[k]=$(id).value;salvar();});
    g('d_dn','destino_nome');g('d_dl','destino_local');g('d_du','destino_unidade');g('d_tr','transportadora');g('d_obs','obs');

    $('rev').onclick=()=>{const e=validar();if(e){M.querySelector('.erro').textContent=e;return;}R.revisar=true;salvar();desenhar();};

  }
  desenhar();
}

function e04VerMov(mid){

  ${m.tipo==='entrada'?`<tr><td colspan="3"><b>Pedido</b></td><td class="n"><b>${un(its.reduce((a,i)=>a+i.qtd,0))}</b></td><td></td><td class="n"><b>${brl(m.valor_mercadorias)}</b></td><td class="n"><b>${brl(m.valor_acerto)}</b></td><td class="n"><b>${brl(m.frete_total)}</b></td><td class="n"><b>${brl((+m.taxa_total||0)+(+m.comissao_total||0)+(+m.taxa_extra_total||0))}</b></td><td class="n"><b>${brl(m.custo_pedido)}</b></td><td></td></tr>`:''}</table></div>
  ${m.tipo==='entrada'?`<div class="meta">Acerto ${dec(m.acerto_pct)}% ${m.acerto_tipo==='desconto'?'de desconto':'de acréscimo'} · transporte ${brl(m.frete_total)} · taxa ${brl(m.taxa_total)} · comissão ${brl(m.comissao_total)} · taxa extra ${brl(m.taxa_extra_total)} — rateados pelo subtotal de cada produto.</div>`:''}

    const qa=(x.antes&&x.antes.itens)||[],qd=(x.depois&&x.depois.itens)||[];
    const dif=x.acao==='corrigido'?qa.map(a=>{const d=qd.find(z=>z.id===a.id);return d&&d.qtd!==a.qtd?`${produto(a.produto_id).nome}: ${un(a.qtd)} → ${un(d.qtd)} un.`:'';}).filter(Boolean).join(' · '):'';
    return `<div class="lin"><div><b>${nomeAcao[x.acao]||x.acao}</b> · ${esc(e04Nome(x.responsavel))} · ${fts(x.em)}${x.justificativa?`<div class="meta" style="margin:0">Motivo: ${esc(x.justificativa)}</div>`:''}${dif?`<div class="meta" style="margin:0">${esc(dif)}</div>`:''}${s&&x.acao.startsWith('solicitado')?`<div class="meta" style="margin:0">Situação: ${s.status}</div>`:''}</div></div>`;}).join('')||'<div class="lin">—</div>'}</div>
  ${pd?`<div class="warn" style="margin-top:8px">Há uma solicitação pendente (${pd.tipo==='estorno'?'estorno':'correção'}) aguardando aprovação do Iago. O lançamento e o saldo continuam como estão.</div>`:''}
  <div class="erro"></div><div class="rodape"><button id="cx">Fechar</button>${m.status==='confirmado'&&!pd?'<button class="primary" id="sol">Solicitar alteração</button>':''}</div>`,true);

  if($('sol'))$('sol').onclick=()=>e04Solicitar(mid);
}
function e04Solicitar(mid){
  const m=E04.movs.find(x=>x.id===mid),its=e04ItensDe(mid),vs=e04VolsDe(mid);let tipo='correcao';
  const desenhar=()=>{
    abrir(`<h2>Solicitar alteração · ${m.tipo==='entrada'?'Entrada':'Despacho'} #${m.id}</h2><div class="sub">Nada muda até o Iago aprovar. Altere só os campos que estão errados.</div>
    <div class="seg" style="margin-bottom:10px"><button class="${tipo==='correcao'?'on':''}" data-tp="correcao">Corrigir dados</button><button class="${tipo==='estorno'?'on':''}" data-tp="estorno">Estornar movimentação inteira</button></div>
    ${tipo==='correcao'?`<div class="scroll"><table class="planilha nt"><tr><th>Produto</th><th class="n">Qtd</th>${m.tipo==='entrada'?'<th class="n">Preço compra/un.</th>':''}</tr>
      ${its.map(i=>`<tr><td style="white-space:normal">${esc(produto(i.produto_id).nome)}</td><td class="n"><input data-si="${i.id}" data-f="qtd" value="${i.qtd}" inputmode="numeric" style="width:70px;text-align:right"></td>
      ${m.tipo==='entrada'?['custo_unit'].map(f=>`<td class="n"><input data-si="${i.id}" data-f="${f}" value="${dec(i[f])}" inputmode="decimal" style="width:86px;text-align:right"></td>`).join(''):''}</tr>`).join('')}</table></div>
      ${m.tipo==='despacho'?`<div class="tres"><div class="campo"><label>Tipo de destino</label><select data-sc="destino_tipo"><option value="">—</option>${Object.entries(TIPOS_DEST).map(([k,l])=>`<option value="${k}" ${m.destino_tipo===k?'selected':''}>${l}</option>`).join('')}</select></div>
       <div class="campo"><label>Quem recebe</label><input data-sc="destino_nome" value="${esc(m.destino_nome||'')}"></div><div class="campo"><label>Unidade</label><input data-sc="destino_unidade" value="${esc(m.destino_unidade||'')}"></div></div>
       <div class="duas"><div class="campo"><label>Local de entrega</label><input data-sc="destino_local" value="${esc(m.destino_local||'')}"></div><div class="campo"><label>Transportadora</label><input data-sc="transportadora" value="${esc(m.transportadora||'')}"></div></div>
       ${vs.map(v=>`<div class="campo"><label>Etiqueta do volume ${v.ordem}</label><input data-sv="${v.id}" value="${esc(v.etiqueta)}" class="codigo"></div>`).join('')}`:''}
      ${m.tipo==='entrada'?`<div class="duas"><div class="campo"><label>Percentual do acerto (%)</label><input data-sd="acerto_pct" value="${dec(m.acerto_pct)}" inputmode="decimal"></div><div class="campo"><label>O acerto é</label><select data-sd="acerto_tipo"><option value="acrescimo" ${m.acerto_tipo!=='desconto'?'selected':''}>Acréscimo</option><option value="desconto" ${m.acerto_tipo==='desconto'?'selected':''}>Desconto</option></select></div></div>
       <div class="duas"><div class="campo"><label>Custo total do transporte (R$)</label><input data-sd="frete" value="${dec(m.frete_total)}" inputmode="decimal"></div><div class="campo"><label>Taxa (R$)</label><input data-sd="taxa" value="${dec(m.taxa_total)}" inputmode="decimal"></div></div>
       <div class="duas"><div class="campo"><label>Comissão (R$)</label><input data-sd="comissao" value="${dec(m.comissao_total)}" inputmode="decimal"></div><div class="campo"><label>Taxa extra (R$)</label><input data-sd="taxa_extra" value="${dec(m.taxa_extra_total)}" inputmode="decimal"></div></div>`:''}
      <div class="duas"><div class="campo"><label>Data</label><input data-sc="data" type="date" value="${esc(m.data)}"></div><div class="campo"><label>Observação</label><input data-sc="obs" value="${esc(m.obs||'')}"></div></div>`
    :`<div class="total">O estorno desfaz a movimentação inteira: ${its.map(i=>esc(produto(i.produto_id).nome)+' '+(m.tipo==='entrada'?'−':'+')+un(i.qtd)+' un.').join(' · ')} no saldo do Estoque 04, depois da aprovação.</div>`}
    <div class="campo"><label>Justificativa *</label><textarea id="s_just" placeholder="Explique o que está errado e por quê"></textarea></div>
    <div id="s_prev" class="meta"></div><div class="erro"></div>
    <div class="rodape"><button id="cx">Voltar</button><button class="primary" id="ok">Enviar para aprovação</button></div>`,true);
    const M=$('modal');
    M.querySelectorAll('[data-tp]').forEach(b=>b.onclick=()=>{tipo=b.dataset.tp;desenhar();});
    const proposta=()=>{const p={};const itens=[];
      its.forEach(i=>{const x={id:i.id};M.querySelectorAll(`[data-si="${i.id}"]`).forEach(inp=>{const f=inp.dataset.f;if(f==='qtd'){const q=num(inp.value);if(q!==i.qtd)x.qtd=q;}else{const v=e04Num(inp.value);if(v!==null&&!Number.isNaN(v)&&Math.abs(v-(+i[f]||0))>0.00001)x[f]=v;}});if(Object.keys(x).length>1)itens.push(x);});
      if(itens.length)p.itens=itens;const cab={};M.querySelectorAll('[data-sc]').forEach(inp=>{const k=inp.dataset.sc;if(String(inp.value)!==String(m[k]??''))cab[k]=inp.value;});if(Object.keys(cab).length)p.cabecalho=cab;
      const atualD={acerto_pct:m.acerto_pct,acerto_tipo:m.acerto_tipo,frete:m.frete_total,taxa:m.taxa_total,comissao:m.comissao_total,taxa_extra:m.taxa_extra_total},dsp={};
      M.querySelectorAll('[data-sd]').forEach(inp=>{const k=inp.dataset.sd;if(k==='acerto_tipo'){if(inp.value!==atualD[k])dsp[k]=inp.value;}else{const v=e04Num(inp.value)??0;if(!Number.isNaN(v)&&Math.abs(v-(+atualD[k]||0))>0.00001)dsp[k]=v;}});if(Object.keys(dsp).length)p.despesas=dsp;
      const vols=[];M.querySelectorAll('[data-sv]').forEach(inp=>{const v=vs.find(x=>x.id===+inp.dataset.sv);if(limpaCod(inp.value)!==v.etiqueta)vols.push({id:v.id,etiqueta:limpaCod(inp.value)});});if(vols.length)p.volumes=vols;return p;};
    const prev=()=>{if(tipo!=='correcao'||!$('s_prev'))return;const p=proposta(),l=(p.itens||[]).filter(x=>x.qtd!=null).map(x=>{const i=its.find(y=>y.id===x.id),d=(x.qtd-i.qtd)*(m.tipo==='entrada'?1:-1),s=e04Saldo(i.produto_id);return `${produto(i.produto_id).nome}: saldo ${un(s)} → ${un(s+d)} un. (após aprovação)`;});$('s_prev').textContent=l.join(' · ');};
    M.querySelectorAll('input,select').forEach(i=>i.addEventListener('input',prev));
    $('cx').onclick=()=>e04VerMov(mid);
    $('ok').onclick=()=>{const err=M.querySelector('.erro');const p=tipo==='estorno'?{}:proposta();
      if(tipo==='correcao'&&!Object.keys(p).length){err.textContent='Altere pelo menos um campo.';return;}
      if((p.itens||[]).some(x=>x.qtd!=null&&x.qtd<=0)){err.textContent='Quantidade deve ser maior que zero. Para zerar tudo, use "Estornar movimentação inteira".';return;}
      if(!val('s_just')){err.textContent='Escreva a justificativa.';return;}
      rodar($('ok'),async()=>{const {error}=await sb.rpc('e04_solicitar',{p_mov:mid,p_tipo:tipo,p_prop:p,p_just:val('s_just')});if(error)throw error;await carregarE04();fechar();e04Sub='alteracoes';render();toast('Solicitação enviada para aprovação do Iago.');});};
  };
  desenhar();
}
function e04Decidir(sid,aprovar){
  const s=E04.sols.find(x=>x.id===sid);
  abrir(`<h2>${aprovar?'Aprovar':'Recusar'} solicitação</h2><div class="sub">${s.tipo==='estorno'?'Estorno':'Correção'} do lançamento #${s.mov_id}${aprovar?' — a mudança é aplicada uma única vez e o saldo é ajustado pela diferença.':''}</div>

  <div class="erro"></div><div class="rodape"><button id="cx">Voltar</button><button class="${aprovar?'primary':'danger'}" id="ok">${aprovar?'Aprovar':'Recusar'}</button></div>`);
  $('cx').onclick=fechar;
  $('ok').onclick=()=>rodar($('ok'),async()=>{const {error}=await sb.rpc('e04_decidir',{p_sol:sid,p_aprovar:aprovar,p_obs:val('dc_obs')});if(error)throw error;await carregarE04();fechar();render();toast(aprovar?'Alteração aprovada e aplicada.':'Solicitação recusada.');});
}

function e19Eh(){return perfil&&perfil.papel==='e19';}

async function carregarE19(){
  const vazio={ok:false,sols:[],compras:[],saldos:[],entradas:[],pessoas:{},fc:[],fi:[],fd:[],cor:[],convites:[],urls:E19.urls||{}};
  const souE19=e19Eh(),fin=!souE19&&E04.pode;
  if(!souE19&&!E04.pode){E19=vazio;return;}
  const {data,error}=await sb.rpc('e19_painel');if(error){console.error(error);E19=vazio;return;}
  const n={...vazio,ok:true,sols:data.solicitacoes||[],compras:data.compras||[],saldos:data.saldos||[],entradas:data.entradas||[],pessoas:data.pessoas||{}};
  if(fin){const [c,i,d,k]=await Promise.all([tudo(()=>sb.from('e19_compras').select('*').order('id',{ascending:false})),tudo(()=>sb.from('e19_compra_itens').select('*').order('id')),
      tudo(()=>sb.from('e19_compra_despesas').select('*').order('id')),tudo(()=>sb.from('e19_correcoes').select('*').order('id',{ascending:false}))]);n.fc=c;n.fi=i;n.fd=d;n.cor=k;}
  if(!souE19&&E04.dono){const {data:cv}=await sb.from('e19_convites').select('*').order('nome');n.convites=cv||[];}
  const cam=[...new Set(n.sols.flatMap(s=>(s.itens||[]).flatMap(i=>e19Fotos(i))).filter(c=>c&&!n.urls[c]))];
  for(let k=0;k<cam.length;k+=100){const {data:u}=await sb.storage.from('e19').createSignedUrls(cam.slice(k,k+100),6*3600);(u||[]).forEach(x=>{if(x.signedUrl)n.urls[x.path]=x.signedUrl;});}
  E19=n;
}
async function e19Ampliar(c){let u=e19Url(c);if(!u){const {data,error}=await sb.storage.from('e19').createSignedUrl(c,3600);if(error){toast(msgErro(error));return;}u=data.signedUrl;}ampliar(u);}

// ---------- nova solicitação ----------
// Qualquer produto pode ser pedido: o nome é livre. O cadastro só aparece como sugestão opcional ("vincular"),
// nunca troca o que a pessoa digitou sozinho. Até 6 fotos por produto (câmera ou galeria).
const E19_MAXF=6;
function e19Fotos(i){return i&&i.fotos&&i.fotos.length?i.fotos:(i&&i.foto?[i.foto]:[]);}
function e19Tira(i,tam){const fs=e19Fotos(i);if(!fs.length)return e19Foto(null);const s=tam||40;
  return `<div style="display:flex;gap:4px;flex-wrap:wrap;max-width:${s*3+8}px">${fs.map(c=>{const u=e19Url(c);return `<div class="foto" style="width:${s}px;height:${s}px;border-radius:8px">${u?`<img src="${esc(u)}" alt="" loading="lazy" data-e19amp="${esc(c)}" style="cursor:zoom-in;width:100%;height:100%;object-fit:cover">`:'📷'}</div>`;}).join('')}</div>`;}
async function e19PrepararFoto(f){
  const ehImg=/^image\//.test(f.type||'')||/\.(jpe?g|png|webp|heic|heif|gif|bmp)$/i.test(f.name||'');
  if(!ehImg)throw new Error('Escolha uma foto (imagem).');
  try{const b=await reduzirImagem(new File([f],f.name||'foto.jpg',{type:f.type||'image/jpeg'}),1600);if(b&&b.size)return {blob:b,ext:'jpg',tipo:'image/jpeg'};}catch(e){}
  if(f.size>12*1024*1024)throw new Error('Foto muito grande (máx. 12 MB).');
  const ext=((f.name||'').match(/\.([a-z0-9]+)$/i)||[,'jpg'])[1].toLowerCase();
  return {blob:f,ext,tipo:f.type||'image/'+(ext==='jpg'?'jpeg':ext)};
}
function e19NovaSolic(){
  const K='e19_rasc_sol_'+(sessao&&sessao.user.id);
  const novoItem=()=>({pid:null,nome:'',qtd:'1',un:'un',fotos:[],obs:''});
  const R=e04Ler(K,null)||{idem:crypto.randomUUID(),obs:'',urg:false,itens:[]};
  R.itens.forEach(i=>{if(!Array.isArray(i.fotos))i.fotos=i.foto?[i.foto]:[];delete i.foto;if(i.qtd==null)i.qtd='';});
  if(!R.itens.length)R.itens.push(novoItem());
  const salvar=()=>e04Gravar(K,R);let enviando=false,tentou=false;
  const prevs={},subindo={};// subindo[k] = nº de fotos ainda enviando
  const totSub=()=>Object.values(subindo).reduce((a,b)=>a+b,0);
  async function subirFotos(k,files){
    const it=R.itens[k];const livres=E19_MAXF-it.fotos.length;
    if(livres<=0){toast('Máximo de '+E19_MAXF+' fotos por produto.');return;}
    const lst=[...files].slice(0,livres);if(files.length>livres)toast('Só cabem mais '+livres+' foto(s) neste produto.');
    subindo[k]=(subindo[k]||0)+lst.length;desenhar();
    await Promise.all(lst.map(async f=>{
      try{const p=await e19PrepararFoto(f);const c='fotos/'+sessao.user.id+'/'+crypto.randomUUID()+'.'+p.ext;
        const {error}=await sb.storage.from('e19').upload(c,p.blob,{contentType:p.tipo,upsert:false});if(error)throw error;
        const alvo=R.itens.indexOf(it);if(alvo>=0){it.fotos.push(c);prevs[c]=URL.createObjectURL(p.blob);salvar();}}
      catch(e){toast('Foto não enviada: '+msgErro(e));}
      finally{subindo[k]=Math.max(0,(subindo[k]||1)-1);}
    }));
    desenhar();
  }
  function dica(i,k){
    const cad=i.pid?produto(i.pid):null;
    const sug=!i.pid&&String(i.nome).trim().length>=3?sugestoes(i.nome,false).slice(0,3):[];
    return cad?`<div class="total" style="margin:6px 0 0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px"><span>✔ Vinculado ao cadastro${cad.sku?' · SKU '+esc(cad.sku):''}</span><button class="link" data-desv="${k}">desvincular</button></div>`          :sug.length?`<div class="meta" style="margin:6px 0 2px">Já existe no cadastro? Toque para vincular (opcional):</div><div style="display:flex;gap:6px;flex-wrap:wrap">${sug.map(p=>`<button class="small" data-vinc="${k}|${p.id}" style="text-align:left;max-width:100%;white-space:normal">${esc(p.nome)}${p.sku?' <span class="meta">· '+esc(p.sku)+'</span>':''}</button>`).join('')}</div>`          :String(i.nome).trim()?'<div class="meta" style="margin:4px 0 0"><span class="tag-lanc" style="margin:0">produto novo</span> será pedido assim mesmo — capriche na descrição e nas fotos.</div>':'';
  }
  function cartao(i,k){
    const erroNome=tentou&&!String(i.nome).trim(),erroQtd=tentou&&!(+i.qtd>0);
    const nf=i.fotos.length,sb_=subindo[k]||0;
    return `<div class="card" data-card="${k}" style="flex-direction:column;align-items:stretch;gap:8px;${erroNome||erroQtd?'border-color:var(--red)':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>Produto ${k+1}</b>
        <div style="display:flex;gap:6px">${R.itens.length>1?`<button class="small danger" data-rm="${k}">Remover</button>`:''}</div></div>
      <div class="campo" style="margin:0"><label>O que precisa comprar? <span class="meta" style="font-weight:400">— qualquer produto, mesmo que não esteja cadastrado</span></label>
        <input data-k="${k}" data-f="nome" value="${esc(i.nome)}" placeholder="Ex.: Vassoura de piaçava, fita adesiva larga, saco de lixo 100 L…" autocomplete="off" enterkeyhint="next" maxlength="200" style="${erroNome?'border-color:var(--red)':''}">
        <div id="e19x${k}">${dica(i,k)}</div>
        ${erroNome?'<div class="meta" style="color:var(--red);margin:4px 0 0">Escreva o nome do produto.</div>':''}</div>
      <div class="duas" style="margin:0"><div class="campo" style="margin:0"><label>Quantidade</label>
          <div style="display:flex;gap:6px;align-items:center"><button class="small" data-mais="${k}|-1" style="min-width:40px;font-size:18px">−</button>
          <input data-k="${k}" data-f="qtd" value="${esc(i.qtd)}" inputmode="numeric" placeholder="0" style="text-align:center;${erroQtd?'border-color:var(--red)':''}">
          <button class="small" data-mais="${k}|1" style="min-width:40px;font-size:18px">+</button></div></div>
        <div class="campo" style="margin:0"><label>Unidade</label><select data-k="${k}" data-f="un">${Object.entries(E19_UN).map(([a,b])=>`<option value="${a}" ${i.un===a?'selected':''}>${b}</option>`).join('')}</select></div></div>
      <div class="campo" style="margin:0"><label>Detalhes (marca, modelo, tamanho, cor, voltagem, onde comprar…)</label>
        <textarea data-k="${k}" data-f="obs" rows="2" maxlength="1000" placeholder="Quanto mais detalhe, mais certa a compra." style="width:100%;resize:vertical">${esc(i.obs)}</textarea></div>
      <div><label style="font-size:13px;font-weight:600">Fotos <span class="meta" style="font-weight:400">(${nf}/${E19_MAXF}) — do produto, da embalagem, do código ou de onde ele fica</span></label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
          ${i.fotos.map((c,j)=>{const u=prevs[c]||e19Url(c);return `<div style="position:relative"><div class="foto" style="width:84px;height:84px">${u?`<img src="${esc(u)}" alt="" data-ver="${esc(u)}" style="width:100%;height:100%;object-fit:cover;cursor:zoom-in">`:'📷'}</div>
            <button data-rf="${k}|${j}" title="Remover foto" style="position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;padding:0;font-size:13px;line-height:22px;background:#fff">✕</button></div>`;}).join('')}
          ${Array.from({length:sb_},()=>'<div class="foto" style="width:84px;height:84px;font-size:13px">⏳ enviando</div>').join('')}
          ${nf+sb_<E19_MAXF?`<label class="btnf" style="width:84px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;text-align:center"><span style="font-size:24px">📷</span>Tirar foto<input type="file" accept="image/*" capture="environment" data-ft="${k}" class="hidden"></label>
          <label class="btnf" style="width:84px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;text-align:center"><span style="font-size:24px">🖼</span>Galeria<input type="file" accept="image/*" multiple data-ft="${k}" class="hidden"></label>`:''}
        </div></div></div>`;
  }
  function desenhar(){
    const M0=$('modal');const foco=M0&&document.activeElement&&M0.contains(document.activeElement)&&document.activeElement.dataset?{k:document.activeElement.dataset.k,f:document.activeElement.dataset.f,p:document.activeElement.selectionStart}:null;
    const nF=R.itens.reduce((a,i)=>a+i.fotos.length,0),ns=totSub();
    abrir(`<h2>Nova solicitação de compra</h2><div class="sub">Peça qualquer produto — cadastrado ou não. O rascunho fica salvo sozinho, pode fechar e voltar depois.</div>
    <label class="card" style="cursor:pointer;align-items:center;justify-content:flex-start;gap:12px;margin-bottom:10px;${R.urg?'border-color:var(--red);background:#fef2f2':''}"><input type="checkbox" id="s19_urg" ${R.urg?'checked':''} style="width:22px;height:22px;flex:none"><div><b>🔴 Urgente</b><div class="meta" style="margin:0">Marque só se faltar para hoje/amanhã. Aparece em destaque para o Estoque 04.</div></div></label>
    <div class="lista">${R.itens.map(cartao).join('')}</div>
    <button data-add="1" style="margin-top:10px;width:100%;padding:12px">+ Adicionar outro produto</button>
    <div class="campo" style="margin-top:12px"><label>Observação geral (opcional)</label><input id="s19_obs" value="${esc(R.obs)}" maxlength="500" placeholder="Ex.: entregar na loja, prazo, fornecedor preferido…"></div>
    <div class="total">${R.itens.length} produto(s) · ${nF} foto(s)${ns?` · <b>enviando ${ns} foto(s)…</b>`:''}</div>
    <div class="erro"></div><div class="rodape"><button id="cx">Fechar (mantém rascunho)</button><button class="danger" id="limpa">Descartar</button><button class="primary" id="ok" ${ns?'disabled':''}>${ns?'Aguarde as fotos…':'Enviar solicitação'}</button></div>`,true);
    const M=$('modal');
    M.querySelectorAll('[data-f]').forEach(inp=>{const k=+inp.dataset.k,f=inp.dataset.f;
      inp.addEventListener(inp.tagName==='SELECT'?'change':'input',()=>{const it=R.itens[k];
        if(f==='qtd'){it.qtd=inp.value.replace(/\D/g,'').slice(0,7);if(inp.value!==it.qtd)inp.value=it.qtd;}else it[f]=inp.value;salvar();
        if(f==='nome'){if(it.pid&&(produto(it.pid)||{}).nome!==inp.value)it.pid=null;clearTimeout(inp._t);inp._t=setTimeout(()=>{const x=$('e19x'+k);if(x)x.innerHTML=dica(it,k);},350);} });
      if(f==='nome')inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const q=M.querySelector(`[data-f="qtd"][data-k="${k}"]`);if(q)q.focus();}});});
    M.querySelectorAll('[data-ft]').forEach(inp=>inp.onchange=()=>{const fs=inp.files;if(fs&&fs.length)subirFotos(+inp.dataset.ft,fs);inp.value='';});
    M.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{const [k,j]=b.dataset.rf.split('|').map(Number);R.itens[k].fotos.splice(j,1);salvar();desenhar();});
    M.querySelectorAll('[data-ver]').forEach(im=>im.onclick=()=>ampliar(im.dataset.ver));
    M.onclick=e=>{const v=e.target.closest('[data-vinc]'),d=e.target.closest('[data-desv]');

// mesmo cálculo do servidor (e19_ratear), em centavos
function e19Calc(itens,cab,desp){
  const n=v=>{const x=e04Num(v);return x===null?0:x;},err=[];
  const tx=n(cab.taxa),fr=n(cab.frete),co=n(cab.comissao);
  if([tx,fr,co].some(x=>Number.isNaN(x)||x<0))err.push('Taxa, frete e comissão devem ser valores em reais, zero ou maiores.');
  const D=desp.map(d=>({...d,v:n(d.valor)}));if(D.some(d=>Number.isNaN(d.v)||d.v<0))err.push('Confira o valor das outras despesas.');
  if(D.some(d=>!String(d.descricao||'').trim()))err.push('Informe a descrição de cada despesa.');
  const c=x=>Math.round((Number.isNaN(x)?0:x)*100);
  const L=itens.map(i=>{const q=+i.q||0,cu=e04Num(i.cu),ok=q>0&&cu!==null&&!Number.isNaN(cu)&&cu>=0;const cu4=ok?Math.round(cu*10000)/10000:0;
    const sub=ok?Math.round(q*cu4*100+1e-7):0;const esp=D.filter(d=>String(d.sid||'')===String(i.sid)).reduce((a,d)=>a+c(d.v),0);return {...i,q,cu:cu4,ok,sub,esp};});
  const sh=c(tx)+c(fr)+c(co)+D.filter(d=>!d.sid).reduce((a,d)=>a+c(d.v),0);
  let tw=L.reduce((a,l)=>a+l.sub,0);const usaQ=tw===0;if(usaQ)tw=L.reduce((a,l)=>a+l.q,0);let cw=0;
  L.forEach(l=>{const w=usaQ?l.q:l.sub;l.rat=tw?Math.round(sh*(cw+w)/tw)-Math.round(sh*cw/tw):0;cw+=w;l.tot=l.sub+l.esp+l.rat;l.fin=l.q?l.tot/l.q/100:0;});
  const merc=L.reduce((a,l)=>a+l.sub,0),dsp=c(tx)+c(fr)+c(co)+D.reduce((a,d)=>a+c(d.v),0),total=L.reduce((a,l)=>a+l.tot,0);
  return {L,merc:merc/100,dsp:dsp/100,total:total/100,fecha:merc+dsp===total,err,ok:!err.length&&L.length>0&&L.every(l=>l.ok)};
}

function e19Dif(k){
  const a=k.antes||{},d=k.depois||k.proposta||{},L=[];const nm={fornecedor:'Fornecedor',data_compra:'Data',taxa:'Taxa',frete:'Frete',comissao:'Comissão',valor_total:'Total da compra'};
  const ca=a.cabecalho||{},cd=k.depois?(d.cabecalho||{}):{...ca,...(d.cabecalho||{})};
  Object.keys(nm).forEach(f=>{if(String(ca[f]??'')!==String(cd[f]??'')&&cd[f]!==undefined)L.push(`${nm[f]}: ${['taxa','frete','comissao','valor_total'].includes(f)?brl(ca[f])+' → '+brl(cd[f]):esc(ca[f])+' → '+esc(cd[f])}`);});
  const ia=a.itens||[],idp=k.depois?(d.itens||[]):(d.itens||[]).map(x=>({...(ia.find(y=>y.id===x.id)||{}),...x}));
  idp.forEach(x=>{const y=ia.find(z=>z.id===x.id)||{};if(+x.qtd!==+y.qtd)L.push(`${esc(y.nome||'')}: qtd ${un(y.qtd)} → ${un(x.qtd)}`);if(+x.custo_unit!==+y.custo_unit)L.push(`${esc(y.nome||'')}: custo ${brl(y.custo_unit,4)} → ${brl(x.custo_unit,4)}`);});
  if(d.estornar)L.push('Estorno da compra inteira');
  if(k.proposta&&k.proposta.despesas)L.push('Outras despesas: '+(k.proposta.despesas.map(x=>esc(x.descricao)+' '+brl(x.valor)).join(', ')||'nenhuma'));
  return L.length?`<div class="meta" style="margin:0">${L.join(' · ')}</div>`:'';
}
function e19Corrigir(cid){
  const c=E19.fc.find(x=>x.id===cid),its=E19.fi.filter(x=>x.compra_id===cid),ds=E19.fd.filter(x=>x.compra_id===cid);let est=false;
  const desp=ds.map(d=>({descricao:d.descricao,valor:dec(d.valor),sid:d.sol_item_id||''}));
  function desenhar(){
    abrir(`<h2>Solicitar correção · Compra #${c.id}</h2><div class="sub">Nada muda até o administrador master aprovar. Altere só o que está errado.</div>
    <div class="seg" style="margin-bottom:10px"><button class="${est?'':'on'}" data-t="0">Corrigir dados</button><button class="${est?'on':''}" data-t="1">Estornar compra inteira</button></div>
    ${est?`<div class="total">O estorno desfaz a compra: os itens voltam a ficar pendentes${c.recebida_em?' e o saldo do Estoque 19 é reduzido':''}.</div>`:`
    <div class="duas"><div class="campo"><label>Fornecedor</label><input id="k_forn" value="${esc(c.fornecedor)}"></div><div class="campo"><label>Data da compra</label><input id="k_data" type="date" value="${esc(c.data_compra)}"></div></div>
    <div class="scroll"><table class="planilha nt"><tr><th>Produto</th><th class="n">Qtd</th><th class="n">Custo un. (R$)</th></tr>${its.map(x=>{const i=e19Item(x.sol_item_id)||{};return `<tr><td style="white-space:normal">${esc(i.nome||'')}</td><td class="n"><input data-kq="${x.id}" value="${x.qtd}" inputmode="numeric" style="width:70px;text-align:right"> ${E19_AB[i.unidade]||''}</td><td class="n"><input data-kc="${x.id}" value="${String(+x.custo_unit).replace('.',',')}" inputmode="decimal" style="width:100px;text-align:right"></td></tr>`;}).join('')}</table></div>
    <div class="tres"><div class="campo"><label>Taxa (R$)</label><input id="k_taxa" value="${dec(c.taxa)}"></div><div class="campo"><label>Frete (R$)</label><input id="k_frete" value="${dec(c.frete)}"></div><div class="campo"><label>Comissão (R$)</label><input id="k_com" value="${dec(c.comissao)}"></div></div>
    <div class="meta">Outras despesas</div>${desp.map((d,k)=>`<div style="display:flex;gap:6px;margin:4px 0;flex-wrap:wrap"><input data-kd="${k}" data-f="descricao" value="${esc(d.descricao)}" style="flex:2"><input data-kd="${k}" data-f="valor" value="${esc(d.valor)}" style="width:100px">
      <select data-kd="${k}" data-f="sid"><option value="">Compartilhada</option>${its.map(x=>`<option value="${x.sol_item_id}" ${String(d.sid)===String(x.sol_item_id)?'selected':''}>Só: ${esc((e19Item(x.sol_item_id)||{}).nome||'')}</option>`).join('')}</select><button class="small danger" data-kdrm="${k}">✕</button></div>`).join('')}
    <button class="small" id="k_dadd">+ Adicionar despesa</button>`}
    <div class="campo" style="margin-top:10px"><label>Motivo da correção *</label><textarea id="k_mot"></textarea></div>
    <div class="erro"></div><div class="rodape"><button id="cx">Voltar</button><button class="primary" id="ok">Enviar para aprovação</button></div>`,true);
    const M=$('modal');M.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{est=b.dataset.t==='1';desenhar();});
    M.querySelectorAll('[data-kd]').forEach(inp=>inp.addEventListener(inp.tagName==='SELECT'?'change':'input',()=>{desp[+inp.dataset.kd][inp.dataset.f]=inp.value;}));
    M.querySelectorAll('[data-kdrm]').forEach(b=>b.onclick=()=>{desp.splice(+b.dataset.kdrm,1);desenhar();});
    if($('k_dadd'))$('k_dadd').onclick=()=>{desp.push({descricao:'',valor:'',sid:''});desenhar();};
    $('cx').onclick=()=>e19VerCompra(cid);
    $('ok').onclick=()=>{const err=M.querySelector('.erro');let p={};
      if(est)p={estornar:true};else{
        const cab={};if(val('k_forn')!==c.fornecedor)cab.fornecedor=val('k_forn');if(val('k_data')!==c.data_compra)cab.data_compra=val('k_data');
        [['k_taxa','taxa'],['k_frete','frete'],['k_com','comissao']].forEach(([id,f])=>{const v=e04Num(val(id))??0;if(Number.isNaN(v)||v<0){p.erro=1;}else if(Math.abs(v-(+c[f]||0))>0.004)cab[f]=v;});
        if(p.erro){err.textContent='Confira taxa, frete e comissão.';return;}
        if(Object.keys(cab).length)p.cabecalho=cab;
        const it=[];its.forEach(x=>{const o={id:x.id},q=num(M.querySelector(`[data-kq="${x.id}"]`).value),cu=e04Num(M.querySelector(`[data-kc="${x.id}"]`).value);
          if(q!==x.qtd)o.qtd=q;if(cu!==null&&!Number.isNaN(cu)&&Math.abs(cu-(+x.custo_unit))>0.00001)o.custo_unit=cu;if(Object.keys(o).length>1)it.push(o);});
        if(it.some(o=>o.qtd!=null&&o.qtd<=0)){err.textContent='Quantidade deve ser maior que zero. Para desfazer, use o estorno.';return;}
        if(it.length)p.itens=it;
        const nd=desp.map(d=>({descricao:String(d.descricao).trim(),valor:e04Num(d.valor)??0,sol_item_id:d.sid?+d.sid:null}));
        const od=ds.map(d=>({descricao:d.descricao,valor:+d.valor,sol_item_id:d.sol_item_id||null}));
        if(nd.some(d=>!d.descricao||Number.isNaN(d.valor)||d.valor<0)){err.textContent='Confira as outras despesas.';return;}
        if(JSON.stringify(nd)!==JSON.stringify(od))p.despesas=nd;
        if(!Object.keys(p).length){err.textContent='Altere pelo menos um dado.';return;}}
      if(!val('k_mot')){err.textContent='Informe o motivo.';return;}
      rodar($('ok'),async()=>{const {error}=await sb.rpc('e19_solicitar_correcao',{p_compra:cid,p_motivo:val('k_mot'),p_proposta:p});if(error)throw error;await carregarE19();fechar();render();toast('Correção enviada para aprovação do administrador.');});};
  }
  desenhar();
}
