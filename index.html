<style>

body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}

:root{--bg:#f5f5f4;--line:#e2e2df;--pri:#111111;--pri2:#000000;--ink:#111111;--mut:#64645f}

<body>
<div id="app"><div class="login"><img class="logo-img" src="logo.png" alt="Tudo Mix"><h1>Tudo Mix Estoque</h1><div class="sub">Carregando…</div></div></div>
<div id="ov" class="ov hidden"><div id="modal" class="modal"></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL='https://rxqlkfzsvoqydqqzffih.supabase.co';
const SUPABASE_KEY='sb_publishable__IZIszN0QheZChaDwqVA8A_vlQnP9tw';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const PAPEIS={admin:'Administrador',estoque:'Estoque',socio:'Sócio (só visualização)'};
const MODS={flex:'Flex',full:'Full',agencia:'Agência'};
let sessao=null,perfil=null,aba=null,busca='',filtroEst='com',filtroSai={conta:'',mod:'',status:'ativa'},D={produtos:[],contas:[],entradas:[],saidas:[],perfis:[],ajustes:[]},modoLogin='entrar',carregando=false,limite=150;

// ---------- utilidades ----------
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function hoje(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fd(s){if(!s)return '—';const p=String(s).slice(0,10).split('-');return `${p[2]}/${p[1]}/${p[0]}`;}
function fts(s){return s?new Date(s).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';}
function brl(n,dec=2){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:dec});}
function un(n){return Number(n||0).toLocaleString('pt-BR');}
function num(v){const n=parseInt(String(v??'').replace(/\D/g,''),10);return isNaN(n)?0:n;}
function dinheiro(v){let s=String(v??'').trim().replace(/[R$\s]/g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return parseFloat(s);}
function um(x){return Array.isArray(x)?x[0]||null:x||null;}
function val(id){const e=$(id);return e?e.value.trim():'';}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),3000);}
function ehAdmin(){return perfil&&perfil.papel==='admin';}
function verCusto(){return perfil&&['admin','socio'].includes(perfil.papel);}
function podeMov(){return perfil&&['admin','estoque'].includes(perfil.papel);}
function foto(p,peq){return `<div class="foto${peq?' p':''}">${p&&p.foto_url?`<img src="${esc(p.foto_url)}" alt="" loading="lazy">`:'📷'}</div>`;}
function produto(id){return D.produtos.find(p=>p.id===id)||{nome:'(produto)',sku:'',estoque:0};}
function conta(id){return D.contas.find(c=>c.id===id)||{nome:'—'};}
function custo(p){const c=um(p.produtos_custo);return c?+c.custo_medio:0;}
function nomeDe(uid){const p=D.perfis.find(x=>x.user_id===uid);return p?(p.nome||p.email):'';}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function msgErro(e){const m=(e&&(e.message||e.error_description))||'Erro inesperado.';
  if(/Invalid login/i.test(m))return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m))return 'Confirme seu e-mail antes de entrar (veja sua caixa de entrada).';
  if(/already registered/i.test(m))return 'Este e-mail já tem conta. Use "Entrar".';
  if(/Password should be/i.test(m))return 'A senha precisa ter pelo menos 6 caracteres.';
  if(/rate limit/i.test(m))return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(/row-level security|Unauthorized|not allowed/i.test(m))return 'Seu acesso não permite esta ação.';
  if(/Failed to fetch|NetworkError/i.test(m))return 'Sem conexão com a internet. Tente de novo.';
  return m;}
const NOMES_ACAO={registrar_entrada:'Registrou entrada',registrar_saida:'Registrou saída',cancelar_saida:'Cancelou saída',ajustar_estoque:'Ajustou estoque',definir_custo:'Alterou custo médio',salvar_produto:'Editou produto',definir_foto:'Alterou foto de produto',salvar_conta:'Alterou conta',definir_papel:'Alterou acesso de usuário'};
function log(ev,d){try{sb.rpc('registrar_acesso',{p_evento:ev,p_detalhe:d==null?null:String(d).slice(0,300)}).then(()=>{},()=>{});}catch(e){}}
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args);if(error)throw error;log('acao',NOMES_ACAO[fn]||fn);return data;}
async function tudo(q){const out=[];for(let i=0;;i+=1000){const {data,error}=await q().range(i,i+999);if(error)throw error;out.push(...data);if(data.length<1000)break;}return out;}

// fotos
async function reduzirImagem(file,max=1200){
  if(!/^image\//.test(file.type))throw new Error('Escolha um arquivo de imagem (foto).');
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>er(new Error('Não foi possível abrir esta imagem.'));i.src=url;});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.82));}
  finally{URL.revokeObjectURL(url);}
}
async function enviarFoto(pid,file){
  const blob=await reduzirImagem(file);const caminho='p'+pid+'/'+Date.now()+'.jpg';
  const {error}=await sb.storage.from('produtos').upload(caminho,blob,{contentType:'image/jpeg',upsert:true,cacheControl:'31536000'});
  if(error)throw error;
  const url=sb.storage.from('produtos').getPublicUrl(caminho).data.publicUrl;
  await rpc('definir_foto',{p_produto:pid,p_url:url});
  const p=D.produtos.find(p=>p.id===pid);if(p)p.foto_url=url;return url;
}
function ampliar(u){const d=document.createElement('div');d.className='lb';d.innerHTML=`<img src="${esc(u)}" alt="">`;d.onclick=()=>d.remove();document.body.appendChild(d);}

// ---------- modal ----------
function abrir(html,largo){$('modal').className='modal'+(largo?' largo':'');$('modal').innerHTML=html;$('ov').classList.remove('hidden');const f=$('modal').querySelector('input:not([type=hidden]):not([type=file]),select,textarea');if(f&&window.innerWidth>700)setTimeout(()=>f.focus(),30);}
function fechar(){$('ov').classList.add('hidden');$('modal').innerHTML='';}
$('ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')fechar();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('ov').classList.contains('hidden'))fechar();});
async function rodar(btn,fn){const err=$('modal').querySelector('.erro');if(err)err.textContent='';btn.disabled=true;
  try{await fn();}catch(e){console.error(e);if(err)err.textContent=msgErro(e);else toast(msgErro(e));btn.disabled=false;}}
function confirmar(t,txt,btn,fn){
  abrir(`<h2>${esc(t)}</h2><div class="sub">${esc(txt)}</div><div class="erro"></div><div class="rodape"><button id="cx">Voltar</button><button class="primary" id="ok">${esc(btn)}</button></div>`);
  $('cx').onclick=fechar;$('ok').onclick=()=>rodar($('ok'),async()=>{await fn();fechar();});
}

// ---------- autenticação ----------
const LOGO=`<img class="logo-img" src="logo.png" alt="Tudo Mix">`;
function telaLogin(msg){
  const cad=modoLogin==='criar',rec=modoLogin==='esqueci';
  $('app').innerHTML=`<div class="login">${LOGO}<h1>Tudo Mix Estoque</h1>
  <div class="sub">${cad?'Crie sua conta de acesso.':rec?'Vamos enviar um link para criar uma nova senha.':'Entre com seu e-mail e senha.'}</div>
  <form id="fl">
    ${cad?'<div class="campo"><label>Seu nome</label><input id="l_nome" autocomplete="name" required></div>':''}
    <div class="campo"><label>E-mail</label><input id="l_email" type="email" autocomplete="email" required></div>
    ${rec?'':`<div class="campo"><label>Senha</label><input id="l_senha" type="password" autocomplete="${cad?'new-password':'current-password'}" required minlength="6"></div>`}
    <div class="erro" id="l_erro">${esc(msg||'')}</div>
    <button class="primary" id="l_ok">${cad?'Criar conta':rec?'Enviar link':'Entrar'}</button>
  </form>
  <div class="alt">${cad||rec?'<button class="link" data-m="entrar">Voltar para entrar</button>':'<button class="link" data-m="criar">Criar conta</button> · <button class="link" data-m="esqueci">Esqueci a senha</button>'}</div></div>`;
  $('app').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{modoLogin=b.dataset.m;telaLogin();});
  $('fl').onsubmit=async e=>{e.preventDefault();const b=$('l_ok');b.disabled=true;$('l_erro').textContent='';
    const email=val('l_email');
    try{
      if(cad){const {data,error}=await sb.auth.signUp({email,password:$('l_senha').value,options:{data:{nome:val('l_nome')},emailRedirectTo:location.origin+location.pathname}});
        if(error)throw error;
        if(!data.session){modoLogin='entrar';telaLogin();$('l_erro').style.color='#15803d';$('l_erro').textContent='Conta criada! Abra o e-mail de confirmação que enviamos, clique no link e depois entre aqui.';return;}}
      else if(rec){const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;
        $('l_erro').style.color='#15803d';$('l_erro').textContent='Pronto! Veja seu e-mail e clique no link.';b.disabled=false;return;}
      else{const {error}=await sb.auth.signInWithPassword({email,password:$('l_senha').value});if(error)throw error;}
    }catch(err){$('l_erro').style.color='';$('l_erro').textContent=msgErro(err);b.disabled=false;}
  };
}
function telaPendente(){
  $('app').innerHTML=`<div class="login">${LOGO}<h1>Tudo Mix Estoque</h1><div class="sub">Olá, ${esc(perfil?.nome||sessao.user.email)}.</div>
  <p class="passo">Sua conta foi criada e está aguardando liberação do administrador.</p>
  <button class="primary" id="pv" style="width:100%">Verificar de novo</button>
  <div class="alt"><button class="link" id="ps">Sair</button></div></div>`;
  $('pv').onclick=()=>carregarPerfil();$('ps').onclick=()=>sb.auth.signOut();
}

sb.auth.onAuthStateChange((ev,s)=>{
  if(ev==='PASSWORD_RECOVERY'){sessao=s;setTimeout(modalNovaSenha,300);}
  if(ev==='SIGNED_IN'&&(!sessao||sessao.user.id!==s.user.id)){sessao=s;setTimeout(carregarPerfil,0);}
  if(ev==='SIGNED_OUT'){sessao=null;perfil=null;aba=null;modoLogin='entrar';setTimeout(()=>telaLogin(),0);}
  if(s)sessao=s;

async function iniciar(){const {data:{session}}=await sb.auth.getSession();sessao=session;if(!sessao)return telaLogin();await carregarPerfil();}
async function carregarPerfil(){
  const {data,error}=await sb.from('perfis').select('*').eq('user_id',sessao.user.id).maybeSingle();
  if(error){$('app').innerHTML=`<div class="login">${LOGO}<h1>Tudo Mix Estoque</h1><p class="erro">Não foi possível carregar seu acesso. Recarregue a página.</p></div>`;return;}
  perfil=data;if(!perfil||!perfil.papel)return telaPendente();
  if(!aba)aba='estoque';
  if(!window._logou){window._logou=1;log('entrou','Entrou no sistema');}
  await carregar();
}

// ---------- dados ----------
async function carregar(){
  if(carregando)return;carregando=true;
  try{
    const vc=verCusto();
    const [prods,contas,ents,sais,perfis,ajs]=await Promise.all([
      tudo(()=>sb.from('produtos').select('id,nome,sku,ean,marca,foto_url,estoque,ativo'+(vc?',produtos_custo(custo_medio)':'')).order('nome')),
      sb.from('contas').select('*').order('nome').then(r=>{if(r.error)throw r.error;return r.data;}),
      tudo(()=>sb.from('entradas').select('*'+(vc?',entradas_custo(custo_unit,custo_medio_antes,custo_medio_depois)':'')).neq('origem','olist').order('id',{ascending:false})),
      tudo(()=>sb.from('saidas').select('*,saida_itens(id,produto_id,qtd'+(vc?',saida_itens_custo(custo_medio)':'')+'),saida_anexos(id,nome,caminho,tamanho)').order('id',{ascending:false})),
      sb.from('perfis').select('*').order('nome').then(r=>{if(r.error)throw r.error;return r.data;}),
      sb.from('ajustes').select('*').order('id',{ascending:false}).limit(500).then(r=>r.data||[])]);
    D.produtos=prods;D.contas=contas;D.entradas=ents;D.saidas=sais;D.perfis=perfis;D.ajustes=ajs;
    if(ehAdmin()){const x=await sb.from('acessos').select('*').order('id',{ascending:false}).limit(800);D.acessos=x.data||[];}
  }catch(e){console.error(e);toast('Não foi possível atualizar os dados.');}
  carregando=false;render();
}
setInterval(()=>{if(perfil&&perfil.papel&&$('ov').classList.contains('hidden')&&document.visibilityState==='visible')carregar();},90000);
setInterval(()=>{if(perfil&&document.visibilityState==='visible')sb.rpc('pulso').then(()=>{},()=>{});},50000);

// ---------- tela principal ----------
function abasDoPapel(){
  const a=[['estoque','Estoque'],['saidas','Saídas'],['entradas','Entradas'],['relatorio','Resumo por conta']];
  if(ehAdmin()){a.push(['contas','Contas']);a.push(['usuarios','Usuários']);a.push(['acessos','Acessos']);}
  return a;
}
function render(){
  if(!perfil||!perfil.papel)return;
  const abas=abasDoPapel();if(!abas.find(x=>x[0]===aba))aba=abas[0][0];
  const conteudo={estoque:abaEstoque,saidas:abaSaidas,entradas:abaEntradas,relatorio:abaRelatorio,contas:abaContas,usuarios:abaUsuarios,acessos:abaAcessos}[aba]();
  const ativo=document.activeElement&&document.activeElement.id==='busca';const pos=ativo?document.activeElement.selectionStart:0;
  $('app').innerHTML=`<div class="topo"><div class="wrap"><div class="marca">${LOGO}<div>Estoque<small>Entradas e saídas · Flex · Full · Agência</small></div></div>
    <div class="quem"><span>${esc(perfil.nome||perfil.email)}</span><span class="badge b-pap">${PAPEIS[perfil.papel]}</span>
    <button class="small" data-act="atualizar">Atualizar</button><button class="small" data-act="sair">Sair</button></div></div></div>
    <div class="wrap"><nav class="abas">${abas.map(([k,l])=>`<button class="${aba===k?'on':''}" data-aba="${k}">${l}</button>`).join('')}</nav>${conteudo}</div>`;

}
function barraBusca(ph,botoes=''){return `<div class="barra"><input id="busca" type="search" placeholder="${ph}" value="${esc(busca)}">${botoes}</div>`;}
function bate(...c){const q=norm(busca.trim());return !q||q.split(/\s+/).every(w=>norm(c.join(' ')).includes(w));}
function botoesMov(){return podeMov()?'<button data-act="entrada">+ Entrada</button><button class="primary" data-act="saida">+ Saída</button>':'';}

function abaEstoque(){
  const vc=verCusto();
  const todos=D.produtos.filter(p=>p.ativo!==false);
  const f={com:p=>p.estoque>0,zer:p=>p.estoque<=0,todos:()=>true,semcusto:p=>p.estoque>0&&!custo(p)}[filtroEst]||(()=>true);
  const lst=todos.filter(f).filter(p=>bate(p.nome,p.sku,p.ean,p.marca)).sort((a,b)=>(b.estoque>0)-(a.estoque>0)||a.nome.localeCompare(b.nome));

   <div class="kpi"><div class="n">${un(tu)}</div><div class="l">Unidades em estoque</div></div>
   ${vc?`<div class="kpi"><div class="n">${brl(tv)}</div><div class="l">Valor a custo médio</div></div>`:''}</div>
  <div class="chips" style="margin-bottom:10px">${chips.map(([k,l])=>`<button class="${filtroEst===k?'on':''}" data-fe="${k}">${l}</button>`).join('')}</div>
  <div class="lista">${lst.length?lst.slice(0,limite).map(p=>`<div class="card click" data-prod="${p.id}" style="${p.estoque>0?'':'opacity:.6'}"><div class="pinfo">${foto(p)}<div><div class="t">${esc(p.nome)}</div>
    <div class="meta">${[p.sku?'SKU '+esc(p.sku):'',p.ean?'EAN '+esc(p.ean):'',p.marca?esc(p.marca):''].filter(Boolean).join(' · ')}${vc?' · Custo médio <b>'+(custo(p)?brl(custo(p),2):'—')+'</b>':''}</div></div></div>
    <div class="dir"><div class="n">${un(p.estoque)} un.</div>${vc&&custo(p)?`<div class="meta">${brl(p.estoque*custo(p))}</div>`:''}</div></div>`).join('')
    +(lst.length>limite?`<button data-act="mais">Mostrar mais (${un(lst.length-limite)} restantes)</button>`:'')
    :`<div class="vazio">${D.produtos.length?'Nada encontrado.':'Nenhum produto ainda.'}</div>`}</div>`;

function itensSaida(s){return s.saida_itens||[];}
function totSaida(s){return itensSaida(s).reduce((a,i)=>a+i.qtd,0);}
function custoSaida(s){return itensSaida(s).reduce((a,i)=>{const c=um(i.saida_itens_custo);return a+i.qtd*(c?+c.custo_medio:0);},0);}
function badgeMod(m){return `<span class="badge m-${m}">${MODS[m]||m}</span>`;}
function selContas(id,v,todas){return `<select id="${id}">${todas?'<option value="">Todas as contas</option>':'<option value="">Escolha a conta…</option>'}${D.contas.filter(c=>todas||c.ativa).map(c=>`<option value="${c.id}" ${String(v)===String(c.id)?'selected':''}>${esc(c.nome)}</option>`).join('')}</select>`;}

   <select id="fs_mod"><option value="">Todas as modalidades</option>${Object.entries(MODS).map(([k,l])=>`<option value="${k}" ${f.mod===k?'selected':''}>${l}</option>`).join('')}</select>

    +(lst.length>limite?`<button data-act="mais">Mostrar mais</button>`:'')
    :'<div class="vazio">Nenhuma saída registrada.</div>'}</div>`;
}

let relDe='',relAte='';
function abaRelatorio(){
  if(!relDe){const d=new Date();relDe=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';relAte=hoje();}
  const vc=verCusto();
  const ss=D.saidas.filter(s=>s.status==='ativa'&&s.data>=relDe&&s.data<=relAte);
  const m={};
  ss.forEach(s=>{const k=s.conta_id;m[k]=m[k]||{flex:0,full:0,agencia:0,tot:0,val:0,n:0};m[k][s.modalidade]+=totSaida(s);m[k].tot+=totSaida(s);m[k].val+=custoSaida(s);m[k].n++;});
  const linhas=Object.entries(m).sort((a,b)=>b[1].tot-a[1].tot);
  const T=linhas.reduce((t,[,x])=>{['flex','full','agencia','tot','val','n'].forEach(k=>t[k]+=x[k]);return t;},{flex:0,full:0,agencia:0,tot:0,val:0,n:0});
  const pp={};ss.forEach(s=>itensSaida(s).forEach(i=>{pp[i.produto_id]=(pp[i.produto_id]||0)+i.qtd;}));
  const top=Object.entries(pp).sort((a,b)=>b[1]-a[1]).slice(0,15);
  return `<div class="barra" style="align-items:center"><label class="meta">De</label><input id="r_de" type="date" value="${relDe}" style="max-width:170px"><label class="meta">até</label><input id="r_ate" type="date" value="${relAte}" style="max-width:170px"></div>
  <div class="resumo"><div class="kpi"><div class="n">${un(T.n)}</div><div class="l">Saídas no período</div></div><div class="kpi"><div class="n">${un(T.tot)}</div><div class="l">Unidades que saíram</div></div>${vc?`<div class="kpi"><div class="n">${brl(T.val)}</div><div class="l">Valor a custo</div></div>`:''}</div>
  ${linhas.length?`<div class="scroll"><table class="planilha"><tr><th>Conta</th><th class="n">Flex</th><th class="n">Full</th><th class="n">Agência</th><th class="n">Total un.</th>${vc?'<th class="n">Valor a custo</th>':''}</tr>
  ${linhas.map(([k,x])=>`<tr><td>${esc(conta(+k).nome)}</td><td class="n">${un(x.flex)}</td><td class="n">${un(x.full)}</td><td class="n">${un(x.agencia)}</td><td class="n"><b>${un(x.tot)}</b></td>${vc?`<td class="n">${brl(x.val)}</td>`:''}</tr>`).join('')}
  <tr><td><b>Total</b></td><td class="n"><b>${un(T.flex)}</b></td><td class="n"><b>${un(T.full)}</b></td><td class="n"><b>${un(T.agencia)}</b></td><td class="n"><b>${un(T.tot)}</b></td>${vc?`<td class="n"><b>${brl(T.val)}</b></td>`:''}</tr></table></div>
  <h3>Produtos que mais saíram</h3><div class="scroll"><table class="planilha"><tr><th>Produto</th><th>SKU</th><th class="n">Unidades</th><th class="n">Em estoque</th></tr>${top.map(([pid,q])=>{const p=produto(+pid);return `<tr class="cl" data-prod="${pid}"><td>${esc(p.nome)}</td><td>${esc(p.sku||'')}</td><td class="n">${un(q)}</td><td class="n">${un(p.estoque)}</td></tr>`;}).join('')}</table></div>`
  :'<div class="vazio">Nenhuma saída neste período.</div>'}`;
}

  ${lst.length?`<div class="scroll"><table class="planilha"><tr><th>Data e hora</th><th>Pessoa</th><th>O que fez</th></tr>${lst.map(a=>`<tr><td>${new Date(a.em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${esc(nomeDe(a.user_id)||'—')}</td><td>${txt(a)}</td></tr>`).join('')}</table></div>`:'<div class="vazio">Nenhum registro ainda.</div>'}`;

// ---------- busca de produto (nome, SKU, EAN ou leitor de código de barras) ----------
function acharCodigo(t){t=String(t||'').trim();if(!t)return null;const l=t.toLowerCase();
  return D.produtos.find(p=>(p.sku||'').toLowerCase()===l)||D.produtos.find(p=>(p.ean||'')===t)||null;}
function sugestoes(t,soComEstoque){const q=norm(t.trim());if(q.length<2)return [];const ws=q.split(/\s+/);
  return D.produtos.filter(p=>(!soComEstoque||p.estoque>0)&&ws.every(w=>norm(p.nome+' '+(p.sku||'')+' '+(p.ean||'')+' '+(p.marca||'')).includes(w))).slice(0,12);}
function ligarBusca(inp,box,soComEstoque,escolher){
  const mostrar=()=>{const l=sugestoes(inp.value,soComEstoque);box.innerHTML=l.map(p=>`<div class="sug" data-pid="${p.id}">${foto(p,1)}<div><div>${esc(p.nome)}</div><div class="meta">${esc(p.sku||'')}${p.ean?' · '+esc(p.ean):''} · ${un(p.estoque)} un.</div></div></div>`).join('');box.classList.toggle('hidden',!l.length);};
  inp.addEventListener('input',mostrar);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const p=acharCodigo(inp.value)||(sugestoes(inp.value,soComEstoque).length===1?sugestoes(inp.value,soComEstoque)[0]:null);if(p){box.classList.add('hidden');escolher(p);}}});
  box.addEventListener('mousedown',e=>{const s=e.target.closest('[data-pid]');if(!s)return;e.preventDefault();box.classList.add('hidden');escolher(produto(+s.dataset.pid));});
}

function modalEntrada(pre){
  const adm=ehAdmin();let sel=pre||null;
  abrir(`<h2>Entrada de mercadoria</h2><div class="sub">Busque pelo nome, SKU ou EAN (pode usar o leitor de código de barras).${adm?' O custo médio é recalculado automaticamente.':''}</div>
  <div class="campo"><label>Produto</label><input id="e_busca" placeholder="Nome, SKU ou EAN" autocomplete="off" value="${sel?esc(sel.nome):''}"><div id="e_sug" class="sugs hidden"></div></div>
  <div id="e_novo" class="${sel?'hidden':''}"><div class="meta" style="margin:-4px 0 8px">Produto novo? Preencha SKU e EAN abaixo. Se escolher um produto da lista, estes campos somem.</div>
   <div class="duas"><div class="campo"><label>SKU</label><input id="e_sku"></div><div class="campo"><label>EAN</label><input id="e_ean" inputmode="numeric"></div></div></div>
  <div id="e_sel" class="total ${sel?'':'hidden'}"></div>

  <div class="campo"><label>Nota fiscal</label><input id="e_nf"></div></div>
  <div class="duas"><div class="campo"><label>Data</label><input id="e_data" type="date" value="${hoje()}"></div><div class="campo"><label>Observação</label><input id="e_obs"></div></div>
  <div class="total" id="e_prev"></div>
  <div class="erro"></div>
  <div class="rodape"><button id="cx">Cancelar</button><button id="mais">Salvar e lançar outro</button><button class="primary" id="ok">Salvar entrada</button></div>`);
  const prev=()=>{const q=num(val('e_qtd')),c=adm?dinheiro(val('e_custo')):NaN,el=$('e_prev');
    $('e_novo').classList.toggle('hidden',!!sel);$('e_sel').classList.toggle('hidden',!sel);
    if(sel)$('e_sel').innerHTML=`<b>${esc(sel.nome)}</b><br>${esc(sel.sku||'')} · Estoque atual: <b>${un(sel.estoque)} un.</b>${adm?' · Custo médio '+brl(custo(sel),2):''}`;
    if(!q){el.textContent='Informe a quantidade.';return;}
    const q0=sel?sel.estoque:0;let t=`Novo estoque: <b>${un(q0+q)} un.</b>`;
    if(adm&&!isNaN(c)){const c0=sel?custo(sel):0;const nv=q0>0&&c0>0?(q0*c0+q*c)/(q0+q):c;t+=` · Novo custo médio: <b>${brl(nv,2)}</b> · Valor da entrada ${brl(q*c)}`;}
    el.innerHTML=t;};
  ligarBusca($('e_busca'),$('e_sug'),false,p=>{sel=p;$('e_busca').value=p.nome;prev();$('e_qtd').focus();});
  $('e_busca').addEventListener('input',()=>{if(sel&&$('e_busca').value!==sel.nome){sel=null;prev();}});
  ['e_qtd','e_custo'].forEach(id=>$(id)&&$(id).addEventListener('input',prev));prev();
  $('cx').onclick=fechar;
  const salvar=(cont,btn)=>{const q=num(val('e_qtd')),c=adm?dinheiro(val('e_custo')):NaN,err=$('modal').querySelector('.erro');
    if(!sel&&!val('e_busca')){err.textContent='Informe o produto.';return;}
    if(!q){err.textContent='Informe a quantidade.';return;}
    if(!sel&&!val('e_sku')){err.textContent='Produto novo: informe o SKU (ou escolha um produto da lista).';return;}
    rodar(btn,async()=>{await rpc('registrar_entrada',{p_produto_id:sel?sel.id:null,p_nome:sel?null:val('e_busca'),p_sku:sel?null:val('e_sku'),p_ean:sel?null:val('e_ean'),p_qtd:q,p_custo:isNaN(c)?null:c,p_nf:val('e_nf'),p_data:val('e_data')||hoje(),p_obs:val('e_obs')});
      await carregar();toast('Entrada registrada.');if(cont)modalEntrada();else fechar();});};
  $('ok').onclick=()=>salvar(false,$('ok'));$('mais').onclick=()=>salvar(true,$('mais'));
}

// ---------- saída ----------
let rascunho=null;
function modalSaida(){
  rascunho=rascunho||{conta:lerPref('tm_conta',''),mod:lerPref('tm_mod',''),data:hoje(),obs:'',itens:[]};const R=rascunho;
  const desenhar=()=>{
    const tot=R.itens.reduce((s,i)=>s+i.qtd,0);
    abrir(`<h2>Nova saída</h2><div class="sub">Escolha a conta e a modalidade, depois adicione os produtos (nome, SKU, EAN ou leitor de código de barras).</div>
    <div class="duas"><div class="campo"><label>Conta</label>${selContas('s_conta',R.conta)}</div>
    <div class="campo"><label>Data</label><input id="s_data" type="date" value="${R.data}"></div></div>
    <div class="campo"><label>Modalidade</label><div class="seg">${Object.entries(MODS).map(([k,l])=>`<button type="button" class="${R.mod===k?'on':''}" data-mod="${k}">${l}</button>`).join('')}</div></div>
    <div class="campo"><label>Adicionar produto</label><input id="s_busca" placeholder="Nome, SKU ou EAN" autocomplete="off"><div id="s_sug" class="sugs hidden"></div></div>
    ${R.itens.length?`<div class="tab">${R.itens.map((i,ix)=>{const p=produto(i.pid);return `<div class="lin"><div class="pinfo">${foto(p,1)}<div><div>${esc(p.nome)}</div><div class="meta">${esc(p.sku||'')} · disponível ${un(p.estoque)}</div>${i.qtd>p.estoque?'<div class="warn">Mais do que o estoque</div>':''}</div></div>
      <div style="display:flex;gap:6px;align-items:center"><input data-qi="${ix}" value="${i.qtd}" inputmode="numeric"><button class="small danger" data-rmi="${ix}">✕</button></div></div>`;}).join('')}</div>`:'<div class="vazio" style="padding:18px">Nenhum produto adicionado.</div>'}
    <div class="campo" style="margin-top:10px"><label>Observação</label><input id="s_obs" value="${esc(R.obs)}" placeholder="ex.: nº do envio Full, coleta…"></div>
    <div class="campo"><label>Etiqueta / comprovante <span style="font-weight:400;color:var(--mut)">(opcional, PDF ou foto)</span></label><input id="s_arq" type="file" accept="application/pdf,image/*" multiple></div>
    <div class="total">Total: <b>${un(tot)} un.</b> em ${R.itens.length} produto(s)</div>
    <div class="erro"></div>
    <div class="rodape"><button id="cx">Fechar</button>${R.itens.length?'<button id="limpar" class="danger">Limpar</button>':''}<button class="primary" id="ok">Registrar saída</button></div>`,true);
    const guardar=()=>{R.conta=val('s_conta');R.data=val('s_data')||hoje();R.obs=val('s_obs');};
    ['s_conta','s_data','s_obs'].forEach(id=>$(id).addEventListener('change',guardar));$('s_obs').addEventListener('input',guardar);
    $('modal').querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{guardar();R.mod=b.dataset.mod;desenhar();});
    $('modal').querySelectorAll('[data-qi]').forEach(inp=>inp.addEventListener('change',()=>{guardar();const q=num(inp.value);if(q)R.itens[+inp.dataset.qi].qtd=q;desenhar();}));
    $('modal').querySelectorAll('[data-rmi]').forEach(b=>b.onclick=()=>{guardar();R.itens.splice(+b.dataset.rmi,1);desenhar();});
    ligarBusca($('s_busca'),$('s_sug'),true,p=>{guardar();const ex=R.itens.find(i=>i.pid===p.id);if(ex)ex.qtd++;else R.itens.push({pid:p.id,qtd:1});desenhar();setTimeout(()=>$('s_busca').focus(),40);});
    $('cx').onclick=()=>{guardar();fechar();};
    if($('limpar'))$('limpar').onclick=()=>{rascunho=null;modalSaida();};
    $('ok').onclick=()=>{guardar();const err=$('modal').querySelector('.erro');
      if(!R.conta){err.textContent='Escolha a conta.';return;}if(!R.mod){err.textContent='Escolha a modalidade: Flex, Full ou Agência.';return;}
      if(!R.itens.length){err.textContent='Adicione pelo menos um produto.';return;}
      const arqs=[...$('s_arq').files];
      rodar($('ok'),async()=>{const id=await rpc('registrar_saida',{p_conta_id:+R.conta,p_modalidade:R.mod,p_data:R.data,p_obs:R.obs,p_itens:R.itens.map(i=>({produto_id:i.pid,qtd:i.qtd}))});
        gravarPref('tm_conta',R.conta);gravarPref('tm_mod',R.mod);
        let falhou=0;for(const f of arqs){try{await enviarAnexo(id,f);}catch(e){falhou++;}}
        rascunho=null;await carregar();fechar();toast(falhou?'Saída registrada, mas '+falhou+' arquivo(s) não foram enviados.':'Saída #'+id+' registrada.');});};
  };
  desenhar();
}
async function enviarAnexo(sid,f){
  if(f.size>15e6)throw new Error('Arquivo maior que 15 MB.');
  const ext=(f.name.split('.').pop()||'pdf').toLowerCase().replace(/[^a-z0-9]/g,'');
  const caminho='s'+sid+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
  const {error}=await sb.storage.from('etiquetas').upload(caminho,f,{contentType:f.type||'application/pdf',upsert:false});if(error)throw error;
  const {error:e2}=await sb.from('saida_anexos').insert({saida_id:sid,nome:f.name.slice(0,150),caminho,tamanho:f.size});
  if(e2){sb.storage.from('etiquetas').remove([caminho]).then(()=>{},()=>{});throw e2;}
}

function lerPref(k,d){try{return localStorage.getItem(k)||d;}catch(e){return d;}}
function gravarPref(k,v){try{localStorage.setItem(k,v);}catch(e){}}

// ---------- eventos ----------
$('app').addEventListener('click',async e=>{
  const t=e.target.closest('[data-aba],[data-act],[data-fe],[data-prod],[data-sai],[data-renconta],[data-togconta]');if(!t)return;
  if(t.dataset.prod){modalProduto(+t.dataset.prod);return;}
  if(t.dataset.sai){modalDetalheSaida(+t.dataset.sai);return;}
  if(t.dataset.aba){aba=t.dataset.aba;busca='';limite=150;log('aba',t.textContent.trim());render();return;}
  if(t.dataset.fe){filtroEst=t.dataset.fe;limite=150;render();return;}
  if(t.dataset.togconta){const c=conta(+t.dataset.togconta);try{await rpc('salvar_conta',{p_id:c.id,p_nome:c.nome,p_ativa:!c.ativa});await carregar();}catch(err){toast(msgErro(err));}return;}
  if(t.dataset.renconta){const c=conta(+t.dataset.renconta);abrir(`<h2>Renomear conta</h2><div class="campo"><label>Nome</label><input id="rc" value="${esc(c.nome)}"></div><div class="erro"></div><div class="rodape"><button id="cx">Voltar</button><button class="primary" id="ok">Salvar</button></div>`);
    $('cx').onclick=fechar;$('ok').onclick=()=>rodar($('ok'),async()=>{await rpc('salvar_conta',{p_id:c.id,p_nome:val('rc'),p_ativa:c.ativa});await carregar();fechar();});return;}
  const a=t.dataset.act;
  if(a==='sair')sb.auth.signOut();
  if(a==='atualizar'){await carregar();toast('Atualizado.');}
  if(a==='entrada')modalEntrada();
  if(a==='saida')modalSaida();
  if(a==='mais'){limite+=300;render();}
  if(a==='novaconta'){t.disabled=true;try{await rpc('salvar_conta',{p_id:null,p_nome:val('c_nova'),p_ativa:true});await carregar();toast('Conta adicionada.');}catch(err){toast(msgErro(err));t.disabled=false;}}
});
$('app').addEventListener('input',e=>{if(e.target.id==='busca'){busca=e.target.value;limite=150;render();}});
$('app').addEventListener('change',async e=>{const id=e.target.id;
  if(id==='filtroAc'){filtroAc=e.target.value;render();return;}
  if(id==='fs_conta'){filtroSai.conta=e.target.value;render();return;}
  if(id==='fs_mod'){filtroSai.mod=e.target.value;render();return;}
  if(id==='fs_st'){filtroSai.status=e.target.value;render();return;}
  if(id==='r_de'||id==='r_ate'){relDe=val('r_de')||relDe;relAte=val('r_ate')||relAte;render();return;}
  const s=e.target.closest('[data-papel]');if(!s)return;
  try{await rpc('definir_papel',{p_user:s.dataset.papel,p_papel:s.value||null});toast('Acesso atualizado.');await carregar();}
  catch(err){toast(msgErro(err));await carregar();}});

iniciar();
</script>
</body>
</html>
